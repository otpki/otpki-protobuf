version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/otpki/otpki-protobuf/gen
      path: otpki/common
  disable:
    - file_option: go_package
      module: buf.build/googleapis/googleapis
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
    - file_option: go_package
      module: buf.build/gnostic/gnostic

plugins:
  # Connect
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: tools/protoc-gen-native/protoc-gen-native
    out: gen
    opt:
      - paths=source_relative
      - converters_pkg=converters

inputs:
  - directory: proto
    paths:
      - proto/otpki/common
