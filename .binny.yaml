tools:
  # tools-build
  - name: buf
    version:
      want: v1.66.1
    method: github-release
    with:
      repo: bufbuild/buf

  - name: protoc-gen-go
    version:
      want: v1.36.11
    method: github-release
    with:
      repo: protocolbuffers/protobuf-go

  - name: protoc-gen-grpc-gateway
    version:
      want: v2.28.0
    method: go-install
    with:
      module: github.com/grpc-ecosystem/grpc-gateway/v2
      entrypoint: protoc-gen-grpc-gateway

  - name: protoc-gen-go-grpc
    version:
      want: v1.6.1
    method: go-install
    with:
      module: google.golang.org/grpc/cmd/protoc-gen-go-grpc

  - name: protoc-gen-connect-go
    version:
      want: v1.19.1
    method: go-install
    with:
      module: connectrpc.com/connect
      entrypoint: cmd/protoc-gen-connect-go

  - name: protoc-gen-connect-openapi
    version:
      want: v0.25.5
    method: github-release
    with:
      repo: sudorandom/protoc-gen-connect-openapi
