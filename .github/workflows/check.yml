name: Check

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
        
    - name: Setup Buf
      uses: bufbuild/buf-setup-action@v1.50.0
      with:
        version: latest

    - name: Setup Just
      uses: extractions/setup-just@v3
        
    - name: Run just check
      run: just check
      
    - name: Check for formatting changes
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "Formatting changes required. Run 'just format' locally and commit the changes."
          git diff --name-only
          exit 1
        else
          echo "No formatting changes needed."
        fi
