name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: otpki/.github/.github/workflows/reusable-go-check.yml@v1
    with:
      setup-go: false
      # buf breaking diffs against refs/remotes/origin/main (see Justfile).
      fetch-base-ref: main
      commands: just check
