version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/otpki/otpki-protobuf/gen
      path: otpki/public
    - file_option: go_package_prefix
      value: github.com/otpki/otpki-protobuf/gen
      path: otpki/common
  disable:
    - file_option: go_package
      module: buf.build/googleapis/googleapis
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
    - file_option: go_package
      module: buf.build/gnostic/gnostic

plugins:
  # Go & Connect
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen
    opt: paths=source_relative

  # GRPC-gateway
  - local: protoc-gen-grpc-gateway
    out: gen
    opt:
      - paths=source_relative
      - generate_unbound_methods=true
  # must generate go-grpc for typing
  - local: protoc-gen-go-grpc
    out: gen
    opt: paths=source_relative

  - local: tools/protoc-gen-native/protoc-gen-native
    out: gen
    opt:
      - paths=source_relative
      - converters_pkg=converters

  - local: tools/protoc-gen-authrequired/protoc-gen-authrequired
    out: .
    opt:
      - paths=source_relative

inputs:
  - directory: proto
    paths:
      - proto/otpki/public
