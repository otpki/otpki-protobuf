syntax = "proto3";
package otpki.common.enrollment.plugin.protocol.cmp.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "otpki/common/api/v1/string_enum.proto";
import "otpki/common/enrollment/end_entity/v1/end_entity.proto";
import "otpki/common/issuance/key/v1/key.proto";
import "otpki/common/x509/v1/x509.proto";

message CMPProtocolConfig {
  int64 id = 1 [(gnostic.openapi.v3.property).read_only = true];
  string name = 2 [(buf.validate.field).string.pattern = "^[a-zA-Z0-9_-]+$"];
  int64 certificate_authority_id = 3 [(buf.validate.field).int64.gt = 0];
  bool end_entity_required = 4;
  end_entity.v1.LoginIDScheme login_id_scheme = 5;
  repeated x509.v1.SubjectDNAttrType login_id_parts = 6; // TODO: in 'combo' mode, order is dictated by UI component
  string login_id_fixed = 7;
  int64 login_id_random_length = 8;
  string login_id_prefix = 9;
  string login_id_postfix = 10;
  int64 end_entity_profile_id = 16 [(buf.validate.field).int64.gt = 0];
  int64 certificate_profile_id = 17 [(buf.validate.field).int64.gt = 0];
  bool allow_cert_verify = 18;
  bool require_cert_for_kur = 19;
  bool allow_hmac_verify = 20;
  string common_shared_secret = 21;
  CmpProtectionType cmp_response_protection = 22;
  int64 cmp_cert_authority_id = 23 [(buf.validate.field).int64.gte = 0];
  int64 pki_cert_authority_id = 24 [(buf.validate.field).int64.gte = 0];
  bool allow_keygen = 25;
  issuance.key.v1.KeyType key_type = 26;
}

// buf:lint:ignore ENUM_VALUE_UPPER_SNAKE_CASE
// buf:lint:ignore ENUM_VALUE_NO_DELETE
enum CmpProtectionType {
  CMP_PROTECTION_TYPE_UNSPECIFIED = 0;
  CMP_PROTECTION_TYPE_signature = 1 [(api.v1.string_value) = "signature"];
  CMP_PROTECTION_TYPE_pbm = 2 [(api.v1.string_value) = "pbm"];
}
