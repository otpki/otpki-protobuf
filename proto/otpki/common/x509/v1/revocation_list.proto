syntax = "proto3";
package otpki.common.x509.v1;

import "google/protobuf/timestamp.proto";
import "otpki/common/x509/v1/x509.proto";

// TODO: no more proto revocation lists
// RevocationList represents a Certificate Revocation List (CRL) as specified by RFC 5280
message RevocationList {
  // Raw contains the complete ASN.1 DER content of the CRL
  bytes raw = 1;
  // RawTBSRevocationList contains just the tbsCertList portion of the ASN.1 DER
  bytes raw_tbs_revocation_list = 2;
  // RawIssuer contains the DER encoded Issuer
  bytes raw_issuer = 3;

  // Issuer contains the DN of the issuing certificate
  Name issuer = 4;
  // AuthorityKeyId is used to identify the public key associated with the issuing certificate
  bytes authority_key_id = 5;

  // Signature data
  bytes signature = 6;
  // SignatureAlgorithm is used to determine the signature algorithm for signing
  SignatureAlgorithm signature_algorithm = 7;

  // RevokedCertificateEntries represents the revoked certificates sequence in the CRL
  repeated RevocationListEntry revoked_certificate_entries = 8;

  // Deprecated in favor of revoked_certificate_entries
  // Included for backward compatibility
  repeated RevokedCertificate revoked_certificates = 9;

  // Number is a monotonically increasing sequence number for a given CRL scope and issuer
  string number = 10; // Using string to represent big.Int

  // Update timestamps
  google.protobuf.Timestamp this_update = 11;
  google.protobuf.Timestamp next_update = 12;

  // Extensions
  repeated Extension extensions = 13;
  repeated Extension extra_extensions = 14;
}

// RevocationListEntry represents an entry in a CRL for a revoked certificate
message RevocationListEntry {
  // Raw contains the raw bytes of the revokedCertificates entry
  bytes raw = 1;

  // SerialNumber represents the serial number of a revoked certificate
  string serial_number = 2; // Using string to represent big.Int

  // RevocationTime represents the time at which the certificate was revoked
  google.protobuf.Timestamp revocation_time = 3;

  // ReasonCode represents the reason for revocation (RFC 5280 Section 5.3.1)
  int32 reason_code = 4;

  // Extensions
  repeated Extension extensions = 5;
  repeated Extension extra_extensions = 6;
}

// RevokedCertificate is included for backward compatibility
// This represents the older PKIX variant used in the deprecated field
message RevokedCertificate {
  // SerialNumber represents the serial number of a revoked certificate
  string serial_number = 1; // Using string to represent big.Int

  // RevocationTime represents the time at which the certificate was revoked
  google.protobuf.Timestamp revocation_time = 2;

  // Extensions
  repeated Extension extensions = 3;
}
