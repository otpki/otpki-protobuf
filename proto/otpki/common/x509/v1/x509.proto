enum RevocationReasonCode {
  REVOCATION_REASON_CODE_UNSPECIFIED = 0;
  REVOCATION_REASON_CODE_KEY_COMPROMISE = 1;
  REVOCATION_REASON_CODE_CA_COMPROMISE = 2;
  REVOCATION_REASON_CODE_AFFILIATION_CHANGE = 3;
  REVOCATION_REASON_CODE_SUPERSEDED = 4;
  REVOCATION_REASON_CODE_CESSATION_OF_OPERATION = 5;
  REVOCATION_REASON_CODE_CERTIFICATE_HOLD = 6;
  REVOCATION_REASON_CODE_REMOVE_FROM_CRL = 8;
  REVOCATION_REASON_CODE_PRIVILEGE_WITHDRAWN = 9;
  REVOCATION_REASON_CODE_AA_COMPROMISE = 10;
