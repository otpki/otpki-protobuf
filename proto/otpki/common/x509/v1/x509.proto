enum SubjectDNAttrType {
  SUBJECT_DN_ATTR_TYPE_UNSPECIFIED = 0;
  // go standard
  SUBJECT_DN_ATTR_TYPE_COMMON_NAME = 1;
  SUBJECT_DN_ATTR_TYPE_COUNTRY = 2;
  SUBJECT_DN_ATTR_TYPE_ORGANIZATION = 3;
  SUBJECT_DN_ATTR_TYPE_ORGANIZATIONAL_UNIT = 4;
  SUBJECT_DN_ATTR_TYPE_LOCALITY = 5;
  SUBJECT_DN_ATTR_TYPE_PROVINCE = 6;
  SUBJECT_DN_ATTR_TYPE_STREET_ADDRESS = 7;
  SUBJECT_DN_ATTR_TYPE_POSTAL_CODE = 8;
  SUBJECT_DN_ATTR_TYPE_SERIAL_NUMBER = 9;
  // requires marshaler
  SUBJECT_DN_ATTR_TYPE_EMAIL = 10;
  SUBJECT_DN_ATTR_TYPE_DOMAIN_COMPONENT = 11;

  SUBJECT_DN_ATTR_TYPE_OID = 101;
}

enum SANAttrType {
  SAN_ATTR_TYPE_UNSPECIFIED = 0;
  // go standard
  SAN_ATTR_TYPE_DNS_NAME = 1;
  SAN_ATTR_TYPE_EMAIL_ADDRESS = 2;
  SAN_ATTR_TYPE_IP_ADDRESS = 3;
  SAN_ATTR_TYPE_URI = 4;
  // requires marshaler
  SAN_ATTR_TYPE_MS_UPN = 5;
  SAN_ATTR_TYPE_KRB5_KPN = 6;

  SAN_ATTR_TYPE_OID = 101;
}

message SubjectDNAttribute {
  SubjectDNAttrType attribute_type = 1 [(buf.validate.field).enum = {
    not_in: [0]
    defined_only: true
  }];
  string attribute_value = 2;
  string oid = 3; // oid only needed for SUBJECT_DN_ATTR_TYPE_OID
}

message SANAttribute {
  SANAttrType attribute_type = 1 [(buf.validate.field).enum = {
    not_in: [0]
    defined_only: true
  }];
  string attribute_value = 2;
  string oid = 3; // oid only needed for SAN_ATTR_TYPE_OID
}

enum DayOfWeek {
  DAY_OF_WEEK_UNSPECIFIED = 0;
  DAY_OF_WEEK_SUNDAY = 1;
  DAY_OF_WEEK_MONDAY = 2;
  DAY_OF_WEEK_TUESDAY = 3;
  DAY_OF_WEEK_WEDNESDAY = 4;
  DAY_OF_WEEK_THURSDAY = 5;
  DAY_OF_WEEK_FRIDAY = 6;
  DAY_OF_WEEK_SATURDAY = 7;
}

enum ExpirationAdjustmentDirection {
  EXPIRATION_ADJUSTMENT_DIRECTION_UNSPECIFIED = 0; // default to day-- (earlier)
  EXPIRATION_ADJUSTMENT_DIRECTION_EARLIER = 1; // day--
  EXPIRATION_ADJUSTMENT_DIRECTION_LATER = 2; // day++
}
