syntax = "proto3";
package otpki.common.x509.v1;

import "buf/validate/validate.proto";
import "google/protobuf/any.proto";

message Extension {
  string id = 1; // OID as string
  bool critical = 2;
  bytes value = 3;
}

// TODO: replace this with SubjectDNAttribute
// Name represents a distinguished name (DN)
message Name {
  repeated string country = 1 [
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items = {
      string: {min_len: 1}
    }
  ];
  repeated string organization = 2 [
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items = {
      string: {min_len: 1}
    }
  ];
  repeated string organizational_unit = 3 [
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items = {
      string: {min_len: 1}
    }
  ];
  repeated string locality = 4 [
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items = {
      string: {min_len: 1}
    }
  ];
  repeated string province = 5 [
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items = {
      string: {min_len: 1}
    }
  ];
  repeated string street_address = 6 [
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items = {
      string: {min_len: 1}
    }
  ];
  repeated string postal_code = 7 [
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items = {
      string: {min_len: 1}
    }
  ];
  string serial_number = 8 [(buf.validate.field).required = false];
  string common_name = 9 [(buf.validate.field).string.min_len = 1];
  repeated NameAttribute names = 10; // For additional name attributes
  repeated NameAttribute extra_names = 11;
}

// NameAttribute represents a name attribute that may not be covered by the standard fields
message NameAttribute {
  string type = 1; // OID as string
  google.protobuf.Any value = 2;
}

