syntax = "proto3";
package otpki.common.core.certificate_profile.v1;

import "buf/validate/validate.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "openapiv3/annotations.proto";
import "otpki/common/api/v1/native_type.proto";

enum CertificateProfilePurpose {
  CERTIFICATE_PROFILE_PURPOSE_UNSPECIFIED = 0;
  // Self-signed/root credential
  CERTIFICATE_PROFILE_PURPOSE_ROOT_CA = 1;
  // A credential representing a sub ca, valid
  // for providers which support hierarchy such as x509 and cvc
  CERTIFICATE_PROFILE_PURPOSE_SUB_CA = 2;
  // Normal issued credential
  CERTIFICATE_PROFILE_PURPOSE_END_ENTITY = 3;
}

enum DayOfWeek {
  DAY_OF_WEEK_UNSPECIFIED = 0;
  DAY_OF_WEEK_SUNDAY = 1;
  DAY_OF_WEEK_MONDAY = 2;
  DAY_OF_WEEK_TUESDAY = 3;
  DAY_OF_WEEK_WEDNESDAY = 4;
  DAY_OF_WEEK_THURSDAY = 5;
  DAY_OF_WEEK_FRIDAY = 6;
  DAY_OF_WEEK_SATURDAY = 7;
}

enum ExpirationAdjustmentDirection {
  EXPIRATION_ADJUSTMENT_DIRECTION_UNSPECIFIED = 0; // default to day-- (earlier)
  EXPIRATION_ADJUSTMENT_DIRECTION_EARLIER = 1; // day--
  EXPIRATION_ADJUSTMENT_DIRECTION_LATER = 2; // day++
}

message CertificateProfile {
  option (api.v1.generate_native) = true;
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (openapi.v3.property).read_only = true
  ]; // not settable on creation
  string name = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 64
  }];
  string description = 3;

  CertificateProfilePurpose purpose = 4 [(buf.validate.field).enum = {
    not_in: [0]
    defined_only: true
  }];

  // not settable on creation
  google.protobuf.Timestamp created_at = 201 [
    (openapi.v3.property).read_only = true,
    (api.v1.go_native_type) = "time.Time",
    (api.v1.go_native_import_path) = "time"
  ];
  // not settable on creation
  google.protobuf.Timestamp updated_at = 202 [
    (openapi.v3.property).read_only = true,
    (api.v1.go_native_type) = "time.Time",
    (api.v1.go_native_import_path) = "time"
  ];

  // validity
  // not_before must always be less than or equal to not_after
  // not_after and not_before must fall within the CAs validity dates

  // not_before = issuance time + validity_offset
  // not_after = not_before + validity_duration
  google.protobuf.Duration validity_duration = 301 [
    (api.v1.go_native_type) = "time.Duration",
    (api.v1.go_native_import_path) = "time"
  ];
  // if both end date and duration are specified, shortest is what is issued
  // not_before = issuance time + validity_offset
  // not_after = validity_end_date
  // for undefined validity, set end date to 9999-12-31 23:59:59+00:00
  google.protobuf.Timestamp validity_end_date = 302 [
    (api.v1.go_native_type) = "time.Time",
    (api.v1.go_native_import_path) = "time"
  ];
  // commonly negative, i.e. -10min
  google.protobuf.Duration validity_offset = 303 [
    (api.v1.go_native_type) = "time.Duration",
    (api.v1.go_native_import_path) = "time"
  ];
  // allows requesting a specific notAfter date in issued
  // if true, the validity profile value can be override with
  // the start and end time specified when adding the EE, if allowed by EE profile
  // or the requested validity from the certificate request, given the protocol supports it (CMP)
  bool allow_validity_override = 304;
  // given the validity is still within the acceptable range,
  // during validity override, allow not_after to be before issuance time (now)
  bool allow_expired_validity_end_date = 305;

  // Days on which credential should not expire
  repeated DayOfWeek forbidden_expiration_days = 311 [(buf.validate.field).repeated = {
    unique: true
    items: {
      enum: {
        not_in: [0]
        defined_only: true
      }
    }
  }];
  // Direction of adjustment for forbidden expiry
  ExpirationAdjustmentDirection expiration_adjustment_direction = 312 [(buf.validate.field).enum.defined_only = true];

  // when true, certificates skip all accounting and the database
  // best combined with short lived certificates that will not be revoked
  bool ephemeral_certificate = 401;

  // if this list is empty, it means all CAs are allowed
  repeated string allowed_certificate_authority_ids = 501 [(buf.validate.field).repeated = {
    unique: true
    items: {
      string: {uuid: true}
    }
  }];

  // require approvals for any operations involving enrollment or in any way editing an end entity, which
  // includes changing the status as a precursor for certificate renewal.
  optional string add_edit_end_entity_approval_profile_id = 511 [(buf.validate.field).string.uuid = true];
  // require approvals to revoke a CA or end entity
  optional string revocation_approval_profile_id = 512 [(buf.validate.field).string.uuid = true];

  repeated string publisher_ids = 521 [(buf.validate.field).repeated = {
    unique: true
    items: {
      string: {uuid: true}
    }
  }];

  // this is a plugin provided ID such as "x509", "cvc", "ssh", etc.
  string provider_id = 1001 [(buf.validate.field).string.pattern = "^[a-z][a-z0-9._-]*$"];
  google.protobuf.Any provider_config = 1002;
}
