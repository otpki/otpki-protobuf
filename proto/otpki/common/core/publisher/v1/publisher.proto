syntax = "proto3";

package otpki.common.core.publisher.v1;

import "buf/validate/validate.proto";
import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "openapiv3/annotations.proto";
import "otpki/common/api/v1/native_type.proto";
import "otpki/common/core/certificate/v1/certificate.proto";
import "otpki/common/core/end_entity/v1/end_entity.proto";
import "otpki/common/core/revocation_list/v1/revocation_list.proto";

enum PublisherTriggerEvent {
  PUBLISHER_TRIGGER_EVENT_UNSPECIFIED = 0;
  PUBLISHER_TRIGGER_EVENT_CERTIFICATE_ISSUED = 1; // can subscribe via cert profile or CA (prof takes precedence)
  PUBLISHER_TRIGGER_EVENT_CERTIFICATE_REVOKED = 2; // can subscribe via cert profile or CA (prof takes precedence)
  PUBLISHER_TRIGGER_EVENT_REVOCATION_LIST_PUBLISHED = 3; // can subscribe via cert profile or CA (prof takes precedence)
  PUBLISHER_TRIGGER_EVENT_END_ENTITY_CREDENTIALS_ISSUED = 4; // can subscribe via end entity (can come from ee prof during enrollment)
}

message Publisher {
  option (api.v1.generate_native) = true;
  // not settable on creation
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (openapi.v3.property).read_only = true
  ];
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 3
  ];
  string description = 3;
  string publisher_type = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9._-]*$"
  ];
  google.protobuf.Any config_data = 5;

  // not settable on creation
  google.protobuf.Timestamp created_at = 201 [
    (openapi.v3.property).read_only = true,
    (api.v1.go_native_type) = "time.Time",
    (api.v1.go_native_import_path) = "time"
  ];
  // not settable on creation
  google.protobuf.Timestamp updated_at = 202 [
    (openapi.v3.property).read_only = true,
    (api.v1.go_native_type) = "time.Time",
    (api.v1.go_native_import_path) = "time"
  ];
}

message RevocationListPublishedPayload {
  revocation_list.v1.RevocationList revocation_list = 1;
}

message CertificatePublishedPayload {
  certificate.v1.Certificate certificate = 1;
}

message CertificateRevokedPayload {
  certificate.v1.Certificate certificate = 1;
}

message EndEntityCredentialsIssuedPayload {
  end_entity.v1.EndEntity end_entity = 1;
  // should be able to extract this from enrollment even if not stored in DB as cleartext
  string password = 2; // envcrypto encrypted password
}
