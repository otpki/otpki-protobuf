syntax = "proto3";
package otpki.common.core.revocation_list.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "openapiv3/annotations.proto";
import "otpki/common/core/certificate_authority/v1/certificate_authority.proto";

message RevocationList {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (openapi.v3.property).read_only = true
  ]; // not settable on creation

  certificate_authority.v1.CertificateAuthorityArtifact artifact = 2;
  string certificate_authority_id = 3 [(buf.validate.field).string.uuid = true];

  string number = 11; // Using string to represent big.Int
  string base_number = 12;
  bool is_delta = 13;
  string signing_key_id = 14 [(buf.validate.field).string.uuid = true];
  string partition_identifier = 15;

  // Update timestamps
  google.protobuf.Timestamp this_update = 21;
  google.protobuf.Timestamp next_update = 22;
}
