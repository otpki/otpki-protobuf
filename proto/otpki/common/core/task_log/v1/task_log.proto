syntax = "proto3";
package otpki.common.core.task_log.v1;

import "google/protobuf/timestamp.proto";

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_ACTIVE = 1;
  TASK_STATE_PENDING = 2;
  TASK_STATE_SCHEDULED = 3;
  TASK_STATE_RETRY = 4;
  TASK_STATE_ARCHIVED = 5;
  TASK_STATE_COMPLETED = 6;
}

message TaskLogEntry {
  string id = 1;
  string task_type = 2;
  string queue = 3;
  TaskState state = 4;
  string payload = 5;

  //Completed fields
  string result = 11;
  google.protobuf.Timestamp completed_at = 12;

  //Retry fields
  string last_err = 21;
  int64 retried = 22;
  int64 max_retries = 23;
  google.protobuf.Timestamp next_run_at = 24;
}

message TaskQueueInfo {
  string name = 1;
  // All time totals
  int64 total_processed = 3;
  int64 total_failed = 4;
  // Current totals
  int64 current_task_count = 5;
  // by state
  int64 active_count = 6;
  int64 scheduled_count = 7;
  int64 retry_count = 8;
  int64 archived_count = 9;
  int64 completed_count = 10;
}
