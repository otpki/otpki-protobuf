syntax = "proto3";
package otpki.common.core.end_entity_profile.v1;

import "buf/validate/validate.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "openapiv3/annotations.proto";
import "otpki/common/api/v1/native_type.proto";

enum EndEntityPasswordGenerationCharset {
  END_ENTITY_PASSWORD_GENERATION_CHARSET_UNSPECIFIED = 0;
  END_ENTITY_PASSWORD_GENERATION_CHARSET_DIGITS_ONLY = 1;
  END_ENTITY_PASSWORD_GENERATION_CHARSET_ENGLISH_LETTERS_AND_DIGITS = 2;
  END_ENTITY_PASSWORD_GENERATION_CHARSET_ALL_PRINTABLE_ENGLISH_CHARACTERS = 3;
}

message EndEntityProfile {
  option (api.v1.generate_native) = true;
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (openapi.v3.property).read_only = true
  ]; // not settable on creation
  string name = 2 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 64
  ];
  string description = 3;

  // not settable on creation
  google.protobuf.Timestamp created_at = 201 [
    (openapi.v3.property).read_only = true,
    (api.v1.go_native_type) = "time.Time",
    (api.v1.go_native_import_path) = "time"
  ];
  // not settable on creation
  google.protobuf.Timestamp updated_at = 202 [
    (openapi.v3.property).read_only = true,
    (api.v1.go_native_type) = "time.Time",
    (api.v1.go_native_import_path) = "time"
  ];

  // identity
  string login_id_prefix = 301 [(buf.validate.field).string.max_len = 64];
  string login_id_suffix = 302 [(buf.validate.field).string.max_len = 64];
  bool login_id_auto_generated = 303;
  bool login_id_validation = 304;
  string login_id_regex = 305; // regex validation that is applied if login_id_validation == true. mutually exclusive with auto-generate
  string default_password = 311; // if default == "", and password required == false, EE may have no password
  bool password_required = 312;
  bool password_auto_generated = 313; // mutually exclusive with prior PW settings
  EndEntityPasswordGenerationCharset password_generation_charset = 314 [(buf.validate.field).enum.defined_only = true];
  int64 password_generation_length = 315 [
    (buf.validate.field).int64 = {gte: 4},
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ]; // can be unset, or >= 4
  int64 minimum_password_strength = 316; // floor((# chars in PW)*log2(# chars in charset))
  bool store_cleartext_password = 317; // this stores an encrypted copy of the password rather than just the hash
  bool use_email = 321; // EE creation allows email to be specified
  bool email_required = 322; // EE creation requires email to be specified
  bool email_domain_modifiable = 323; // false == EE creation does not allow domain (@example.com) to be specified
  string email_domain = 324 [(buf.validate.field).cel = {
    id: "email_domain.isHostname"
    message: "value must be a valid hostname"
    expression: "this == '' || this.isHostname()" // allow empty hostname
  }]; // if use_email == true and domain == "", it must be modifiable

  repeated string available_certificate_profile_ids = 401 [(buf.validate.field).repeated = {
    unique: true
    items: {
      string: {uuid: true}
    }
  }];
  string default_certificate_profile_id = 402 [(buf.validate.field).string.uuid = true];

  repeated string available_certificate_authority_ids = 411 [(buf.validate.field).repeated = {
    unique: true
    items: {
      string: {uuid: true}
    }
  }];
  string default_certificate_authority_id = 412 [(buf.validate.field).string.uuid = true];

  // if these publishers support "end entity notification", end entity events
  // that would result in notification are published here
  repeated string available_publisher_ids = 421 [(buf.validate.field).repeated = {
    unique: true
    items: {
      string: {uuid: true}
    }
  }];

  // validity override, requires 'allow validity override' in certificate profile
  bool use_validity_start_time = 501; // if this is true, EE can set start time settings, the following values are defaults to set notBefore
  bool validity_start_time_modifiable = 502; // whether the EE can set their own params
  google.protobuf.Duration validity_start_time_offset = 503 [
    (api.v1.go_native_type) = "time.Duration",
    (api.v1.go_native_import_path) = "time"
  ]; // default offset from 'now' when to issue certificate
  google.protobuf.Timestamp validity_start_date = 504 [
    (api.v1.go_native_type) = "time.Time",
    (api.v1.go_native_import_path) = "time"
  ]; // default start date for notBefore, if both are set, offset is added to start date rather than 'now'
  bool use_validity_end_time = 511; // if this is true, EE can set end time settings, the following values are defaults to set notAfter
  bool validity_end_time_modifiable = 512; // whether the EE can set their own params
  google.protobuf.Duration validity_end_time_offset = 513 [
    (api.v1.go_native_type) = "time.Duration",
    (api.v1.go_native_import_path) = "time"
  ]; // default offset from 'now' when to expire certificate
  google.protobuf.Timestamp validity_end_date = 514 [
    (api.v1.go_native_type) = "time.Time",
    (api.v1.go_native_import_path) = "time"
  ]; // default end date for notAfter, if both are set, offset is added to end date rather than 'now'

  // maximum number of issuance before being locked to GENERATED state
  int64 allowed_requests = 601 [(buf.validate.field).int64.gte = 0];
  // if > 0, a GENERATED EE may renew without consuming requests when any EE certificate expires within this many 24-hour periods
  int64 allow_renewal_before_expiration_days = 602 [(buf.validate.field).int64.gte = 0];

  // this is a plugin provided ID such as "x509", "cvc", "ssh", etc.
  string provider_id = 1001 [(buf.validate.field).string.pattern = "^[a-z][a-z0-9._-]*$"];
  google.protobuf.Any provider_config = 1002;
}
