syntax = "proto3";
package otpki.common.core.certificate_extension.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "openapiv3/annotations.proto";
import "otpki/common/api/v1/native_type.proto";
import "otpki/common/api/v1/string_enum.proto";

message CustomCertificateExtension {
  option (api.v1.generate_native) = true;
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (openapi.v3.property).read_only = true
  ]; // not settable on creation
  string oid = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 255
  ];
  string name = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 127
  ];
  string description = 4 [(buf.validate.field).string.max_len = 255];
  bool critical = 5; // critical flag on extension
  bool required = 6; // if this ext is included on an end entity, the CSR must have the extension present for issuance (value does not matter)
  bool dynamic = 7; // true == allow CSR to set value. false == use Value no matter what the CSR says
  CertificateExtensionValueEncoding value_encoding = 8 [
    (buf.validate.field).enum.defined_only = true,
    (api.v1.string_enum) = true
  ];
  // when dynamic == false, Value is set in the cert regardless of what the CSR contains
  // when dynamic == true, Value is the default value when a value is not provided in the CSR (Required must == false)
  bytes value = 9;

  // not settable on creation
  google.protobuf.Timestamp created_at = 201 [
    (openapi.v3.property).read_only = true,
    (api.v1.go_native_type) = "time.Time",
    (api.v1.go_native_import_path) = "time"
  ];
  // not settable on creation
  google.protobuf.Timestamp updated_at = 202 [
    (openapi.v3.property).read_only = true,
    (api.v1.go_native_type) = "time.Time",
    (api.v1.go_native_import_path) = "time"
  ];
}

enum CertificateExtensionValueEncoding {
  CERTIFICATE_EXTENSION_VALUE_ENCODING_UNSPECIFIED = 0;
  CERTIFICATE_EXTENSION_VALUE_ENCODING_DER_BIT_STRING = 1 [(api.v1.string_value) = "bit_string"]; // string containing 0 and 1
  CERTIFICATE_EXTENSION_VALUE_ENCODING_DER_INTEGER = 2 [(api.v1.string_value) = "integer"]; // string containing an a int
  CERTIFICATE_EXTENSION_VALUE_ENCODING_DER_OCTET_STRING = 3 [(api.v1.string_value) = "octet_string"]; // string containing hex data
  CERTIFICATE_EXTENSION_VALUE_ENCODING_DER_BOOLEAN = 4 [(api.v1.string_value) = "boolean"]; // string containing true or false
  CERTIFICATE_EXTENSION_VALUE_ENCODING_DER_PRINTABLE_STRING = 5 [(api.v1.string_value) = "printable_string"]; // string containing valid printable characters
  CERTIFICATE_EXTENSION_VALUE_ENCODING_DER_UTF8_STRING = 6 [(api.v1.string_value) = "utf8_string"]; // string containing utf8 characters
  CERTIFICATE_EXTENSION_VALUE_ENCODING_DER_IA5_STRING = 7 [(api.v1.string_value) = "ia5_string"]; // string containing valid IA5 characters
  CERTIFICATE_EXTENSION_VALUE_ENCODING_DER_NULL = 8 [(api.v1.string_value) = "null"]; // should be an empty string
  CERTIFICATE_EXTENSION_VALUE_ENCODING_DER_OBJECT = 9 [(api.v1.string_value) = "der_object"]; // string containing pre-encoded ASN1 structure (hex and/or base64)
}
