syntax = "proto3";
package otpki.common.core.key.v1;

message RSAPSSOptions {
  int32 salt_length = 1;
  uint32 hash = 2;
}

message RSAOAEPOptions {
  uint32 hash = 1;
  bytes label = 2;
}

message RSAPKCS1V15DecryptOptions {
  int32 session_key_len = 1;
}

message Ed25519Options {
  uint32 hash = 1;
  string context = 2;
}

enum MLDSAPHType {
  MLDSAPH_TYPE_UNSPECIFIED = 0; // default (pure)
  MLDSAPH_TYPE_PURE = 1; // direct
  MLDSAPH_TYPE_PREHASH = 2; // HashML-DSA
  MLDSAPH_TYPE_EXTERNAL_MU = 3; // computed mu
}

message MLDSASigningOptions {
  MLDSAPHType variant = 1;
  bytes context = 2;
  uint32 prehash = 3;
}
