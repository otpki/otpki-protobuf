message Key {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (openapi.v3.property).read_only = true
  ]; // not settable on creation
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[a-zA-Z0-9:/_-]+$"
  ];
  string description = 3;
  KeyType key_type = 4;
  google.protobuf.Any key_config_data = 6;
  string key_storage_config_id = 7 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
  string key_driver_type = 8 [(buf.validate.field).string.pattern = "^[a-z][a-z0-9._-]*$"];
  // not settable on creation
  string public_key_pem = 9 [(openapi.v3.property).read_only = true]; // PEM encoded
  string public_key_hash = 10 [(openapi.v3.property).read_only = true];
  // not settable on creation
  google.protobuf.Timestamp created_at = 201 [
    (openapi.v3.property).read_only = true,
    (api.v1.go_native_type) = "time.Time",
    (api.v1.go_native_import_path) = "time"
  ];
  // not settable on creation
  google.protobuf.Timestamp updated_at = 202 [
    (openapi.v3.property).read_only = true,
    (api.v1.go_native_type) = "time.Time",
    (api.v1.go_native_import_path) = "time"
  ];
}
