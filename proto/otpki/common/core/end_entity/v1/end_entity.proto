syntax = "proto3";
package otpki.common.core.end_entity.v1;

import "buf/validate/validate.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "openapiv3/annotations.proto";
import "otpki/common/api/v1/native_type.proto";

enum EndEntityStatus {
  END_ENTITY_STATUS_UNSPECIFIED = 0;
  END_ENTITY_STATUS_NEW = 1; // end entity has been created/approved, waiting on certificate
  END_ENTITY_STATUS_FAILED = 2; // certificate generation has failed
  END_ENTITY_STATUS_GENERATED = 3; // certificate generation has succeeded and certificate has been fetched
  END_ENTITY_STATUS_REVOKED = 4; // end entity is revoked
  END_ENTITY_STATUS_WAITING_FOR_APPROVAL = 5; // end entity has not been created, waiting for approval (this should not persist in DB)
}

enum LoginIDScheme {
  LOGIN_ID_SCHEME_UNSPECIFIED = 0;
  LOGIN_ID_SCHEME_FULL = 1; // use the entire DN as the login id
  LOGIN_ID_SCHEME_DN_PART = 2; // order of precedence list to decide which part to use as login id
  LOGIN_ID_SCHEME_DN_COMBO = 3; // combine multiple parts of DN to get login id
  LOGIN_ID_SCHEME_FIXED = 4; // user specified login id override
  LOGIN_ID_SCHEME_RANDOM = 5; // random
}

message EndEntity {
  option (api.v1.generate_native) = true;
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (openapi.v3.property).read_only = true
  ]; // not settable on creation
  string login_id = 2 [(buf.validate.field) = {
    string: {
      min_len: 3
      max_len: 64
    }
    ignore: IGNORE_IF_ZERO_VALUE
  }];
  string display_name = 3;
  EndEntityStatus status = 4;
  string email = 5 [(buf.validate.field) = {
    string: {email: true}
    ignore: IGNORE_IF_ZERO_VALUE
  }];
  string password = 6;
  string password_clear = 7 [(openapi.v3.property).read_only = true];
  string description = 8;

  optional string end_entity_profile_id = 11 [(buf.validate.field).string.uuid = true];
  string certificate_profile_id = 12 [(buf.validate.field).string.uuid = true];
  string certificate_authority_id = 13 [(buf.validate.field).string.uuid = true];

  repeated string publisher_ids = 21 [(buf.validate.field).repeated = {
    unique: true
    items: {
      string: {uuid: true}
    }
  }];

  // not settable on creation
  google.protobuf.Timestamp created_at = 201 [
    (openapi.v3.property).read_only = true,
    (api.v1.go_native_type) = "time.Time",
    (api.v1.go_native_import_path) = "time"
  ];
  // not settable on creation
  google.protobuf.Timestamp updated_at = 202 [
    (openapi.v3.property).read_only = true,
    (api.v1.go_native_type) = "time.Time",
    (api.v1.go_native_import_path) = "time"
  ];

  // validity override
  google.protobuf.Duration validity_start_time_offset = 301 [
    (api.v1.go_native_type) = "time.Duration",
    (api.v1.go_native_import_path) = "time"
  ]; // offset from 'now' when to issue certificate
  google.protobuf.Timestamp validity_start_date = 302 [
    (api.v1.go_native_type) = "time.Time",
    (api.v1.go_native_import_path) = "time"
  ]; // start date for notBefore, if both are set, offset is added to start date rather than 'now'
  google.protobuf.Duration validity_end_time_offset = 311 [
    (api.v1.go_native_type) = "time.Duration",
    (api.v1.go_native_import_path) = "time"
  ]; // offset from 'now' when to expire certificate
  google.protobuf.Timestamp validity_end_date = 312 [
    (api.v1.go_native_type) = "time.Time",
    (api.v1.go_native_import_path) = "time"
  ]; // end date for notAfter, if both are set, offset is added to end date rather than 'now'

  // number of requests remaining before EE gets set to GENERATED
  int64 remaining_requests = 401 [(openapi.v3.property).read_only = true];

  // this is a plugin provided ID such as "x509", "cvc", "ssh", etc.
  string provider_id = 1001 [(buf.validate.field).string.pattern = "^[a-z][a-z0-9._-]*$"];
  google.protobuf.Any provider_config = 1002;
}
