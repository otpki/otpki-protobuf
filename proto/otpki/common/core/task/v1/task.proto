syntax = "proto3";
package otpki.common.core.task.v1;

import "buf/validate/validate.proto";
import "google/protobuf/any.proto";

enum TaskType {
  TASK_TYPE_UNSPECIFIED = 0;
  TASK_TYPE_CRL_GEN = 1;
  TASK_TYPE_DELTA_CRL_GEN = 2;
  TASK_TYPE_USER_PASSWORD_EXPIRE = 3;
  TASK_TYPE_PUBLISH = 31;
}

message CrlGenTask {
  string ca_id = 1 [(buf.validate.field).string.uuid = true];
}
message DeltaCrlGenTask {
  string ca_id = 1 [(buf.validate.field).string.uuid = true];
}

// UserPasswordExpireTask expires enrollment passwords on NEW end entities
// whose end entity profile configures password_expiration and which have not
// enrolled within that duration since they were last modified.
message UserPasswordExpireTask {}

// Publish Tasks
message PublishTask {
  string publisher_id = 1 [(buf.validate.field).string.uuid = true];
  google.protobuf.Any payload = 2; // this should be a well-defined payload type from core.publisher.v1
}
