syntax = "proto3";
package otpki.common.issuance.key.v1;

message RSAPSSOptions {
  int32 salt_length = 1;
  uint32 hash = 2;
}

message RSAOAEPOptions {
  uint32 hash = 1;
  bytes label = 2;
}

message RSAPKCS1V15DecryptOptions {
  int32 session_key_len = 1;
}

message Ed25519Options {
  uint32 hash = 1;
  string context = 2;
}
