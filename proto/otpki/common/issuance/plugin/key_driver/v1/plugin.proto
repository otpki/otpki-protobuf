syntax = "proto3";
package otpki.common.issuance.plugin.key_driver.v1;

import "google/protobuf/any.proto";
import "otpki/common/issuance/key/v1/key.proto";

message KeyModel {
  key.v1.Key key_info = 1;
  bytes public_key = 2;
}

message CreateKeyResponse {
  KeyModel key = 1;
  google.protobuf.Any plugin_data = 2;
}

message KeyDriverMessage {
  int64 key_storage_config_id = 1;
  google.protobuf.Any message = 2;
}

message SignRequest {
  int64 key_id = 1;
  bytes digest = 2;
  optional google.protobuf.Any opts = 3; // custom serialized format to build crypto.SignerOpts
}

message SignResponse {
  bytes signature = 1;
}

message DecryptRequest {
  int64 key_id = 1;
  bytes ciphertext = 2;
  optional google.protobuf.Any opts = 3; // custom serialized format to build crypto.DecrypterOpts
}

message DecryptResponse {
  bytes plaintext = 1;
}

message DeleteKeyResponse {
  google.protobuf.Any plugin_data = 1;
}

// Key driver message for pre-validation of an activation code against a backing store (or its own config)
message ValidateActivationRequest {}

message ValidateActivationResponse {}

// Stored in KeyStorageConfig.key_storage_config.
// Holds shared crypto material used to protect key_storage_key_config data.
message KeyStorageCryptoConfig {
  // Encrypted DEK bytes (wrapped by the configured crypto key).
  bytes wrapped_dek = 1;

  // Nonce used for key data encryption.
  bytes key_data_nonce = 2;
}
