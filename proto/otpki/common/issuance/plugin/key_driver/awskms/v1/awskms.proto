syntax = "proto3";
package otpki.common.issuance.plugin.key_driver.awskms.v1;

message AWSKMSProfile {
  string region = 1;
  string endpoint = 2; // optional AWS KMS custom endpoint (for local/test environments).
  string profile = 3; // optional config profile (really only used for local/test environments).

  // optional static credentials
  // ideally these come from env vars or IAM context
  // can be set with (function of aws go sdk v2, not our env vars)
  //  - AWS_ACCESS_KEY_ID
  //  - AWS_SECRET_ACCESS_KEY
  //  - AWS_REGION
  //  - etc.
  string access_key_id = 4;
  string secret_access_key = 5;
  string session_token = 6; // only needed for temporary sessions created with STS
}

message AWSKMSKeyData {
  string remote_key_identifier = 1;
  string key_arn = 2;
  string region = 3;
}
