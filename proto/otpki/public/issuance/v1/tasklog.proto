syntax = "proto3";
package otpki.public.issuance.v1;

import "otpki/common/api/query/v1/query.proto";
import "otpki/common/issuance/tasklog/v1/tasklog.proto";

message GetTaskLogListRequest {
  common.api.query.v1.PaginationRequest pagination = 1;
}

message GetTaskLogListResponse {
  repeated otpki.common.issuance.tasklog.v1.TaskLogEntry data = 1;
  common.api.query.v1.PaginationResponse pagination = 2;
}

message GetTaskQueuesRequest {
  common.api.query.v1.PaginationRequest pagination = 1;
}

message GetTaskQueuesResponse {
  repeated string data = 1;
  common.api.query.v1.PaginationResponse pagination = 2;
}

message GetTaskQueueInfoRequest {
  string queue = 1;
}

message GetTaskQueueInfoResponse {
  otpki.common.issuance.tasklog.v1.TaskQueueInfo info = 1;
}
