syntax = "proto3";
package otpki.public.issuance.v1;

import "buf/validate/validate.proto";
import "otpki/common/api/query/v1/query.proto";
import "otpki/common/issuance/key/v1/key.proto";

message GetKeyRequest {
  int64 id = 1 [(buf.validate.field).required = true];
}

message GetKeyResponse {
  common.issuance.key.v1.Key key = 1;
  string public_key_pem = 2; // PEM encoded
  bytes public_key_der = 3;
}

message CreateKeyRequest {
  common.issuance.key.v1.Key key = 1 [(buf.validate.field).required = true];
}

message CreateKeyResponse {
  int64 id = 1;
}

message GetKeyListRequest {
  common.api.query.v1.PaginationRequest pagination = 1;
}

message GetKeyListResponse {
  repeated common.issuance.key.v1.Key data = 1;
  common.api.query.v1.PaginationResponse pagination = 2;
}

message DeleteKeyRequest {
  int64 id = 1 [(buf.validate.field).required = true];
}

message DeleteKeyResponse {}

message GetPQKeyTypesRequest {}
message GetPQKeyTypesResponse {
  repeated common.issuance.key.v1.KeyType data = 1;
}
