syntax = "proto3";
package otpki.public.issuance.v1;

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "otpki/common/api/query/v1/query.proto";
import "otpki/common/issuance/extended_key_usage/v1/extended_key_usage.proto";

message CreateCustomExtKeyUsageRequest {
  common.issuance.extended_key_usage.v1.CustomExtKeyUsage key_usage = 1 [(buf.validate.field).required = true];
}

message CreateCustomExtKeyUsageResponse {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetCustomExtKeyUsageRequest {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message GetCustomExtKeyUsageResponse {
  common.issuance.extended_key_usage.v1.CustomExtKeyUsage key_usage = 1;
}

message UpdateCustomExtKeyUsageRequest {
  common.issuance.extended_key_usage.v1.CustomExtKeyUsage key_usage = 1 [(buf.validate.field).required = true];
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateCustomExtKeyUsageResponse {}

message DeleteCustomExtKeyUsageRequest {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message DeleteCustomExtKeyUsageResponse {}

message GetCustomExtKeyUsageListRequest {
  common.api.query.v1.PaginationRequest pagination = 1;
}

message GetCustomExtKeyUsageListResponse {
  repeated common.issuance.extended_key_usage.v1.CustomExtKeyUsage data = 1;
  common.api.query.v1.PaginationResponse pagination = 2;
}
