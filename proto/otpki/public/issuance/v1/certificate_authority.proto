syntax = "proto3";
package otpki.public.issuance.v1;

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "otpki/common/api/query/v1/query.proto";
import "otpki/common/issuance/certificate_authority/v1/certificate_authority.proto";
import "otpki/common/issuance/key/v1/key.proto";

message CreateCertificateAuthorityRequest {
  common.issuance.certificate_authority.v1.CertificateAuthority certificate_authority = 1 [(buf.validate.field).required = true];
}

message CreateCertificateAuthorityResponse {
  int64 id = 1;
}

message ImportCertificateAuthorityRequest {
  common.issuance.certificate_authority.v1.CertificateAuthority certificate_authority = 1 [(buf.validate.field).required = true];
  bytes certificate_pem = 2;
  bytes p7b_certificate_chain = 3;
  common.issuance.key.v1.Key key_config = 4 [(buf.validate.field).required = true];
  bytes key_pem = 5 [(buf.validate.field).required = true];
  string password = 6;
}

message ImportCertificateAuthorityResponse {
  int64 id = 1;
}

message ImportCertificateAuthorityPKCS12Request {
  common.issuance.certificate_authority.v1.CertificateAuthority certificate_authority = 1 [(buf.validate.field).required = true];
  common.issuance.key.v1.Key key_config = 2 [(buf.validate.field).required = true];
  bytes p12 = 3 [(buf.validate.field).required = true];
  string password = 4;
}

message ImportCertificateAuthorityPKCS12Response {
  int64 id = 1;
}

message CreateCertificateAuthorityCSRRequest {
  int64 ca_id = 1 [(buf.validate.field).required = true];
  int64 key_id = 2;
}

message CreateCertificateAuthorityCSRResponse {
  bytes certificate_request_der = 1;
}

message ImportCertificateAuthorityCertificateRequest {
  int64 ca_id = 1 [(buf.validate.field).required = true];
  bytes certificate_pem = 2;
  bytes p7b_certificate_chain = 3;
}

message ImportCertificateAuthorityCertificateResponse {
  int64 ca_certificate_id = 1;
}

message RenewCertificateAuthorityRequest {
  int64 ca_id = 1 [(buf.validate.field).required = true];
  optional int64 next_key_id = 2;
  optional int64 next_alt_key_id = 3;
}

message RenewCertificateAuthorityResponse {}

// ---- STORE ----

message GetCertificateAuthorityRequest {
  int64 ca_id = 1 [(buf.validate.field).required = true];
}

message GetCertificateAuthorityResponse {
  common.issuance.certificate_authority.v1.CertificateAuthority certificate_authority = 1;
}

message GetCertificateAuthorityListRequest {
  common.api.query.v1.PaginationRequest pagination = 1;
}

message GetCertificateAuthorityListResponse {
  repeated common.issuance.certificate_authority.v1.CertificateAuthority data = 1;
  common.api.query.v1.PaginationResponse pagination = 2;
}

message UpdateCertificateAuthorityRequest {
  common.issuance.certificate_authority.v1.CertificateAuthority certificate_authority = 1 [(buf.validate.field).required = true];
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateCertificateAuthorityResponse {}

message DeleteCertificateAuthorityRequest {
  int64 ca_id = 1 [(buf.validate.field).required = true];
}

message DeleteCertificateAuthorityResponse {}

message GetCertificateAuthorityCertificatesRequest {
  int64 ca_id = 1 [(buf.validate.field).required = true];
}

message GetCertificateAuthorityCertificatesResponse {
  repeated common.issuance.certificate_authority.v1.CertificateAuthorityCertificate certificate_authority_certificates = 1;
}
