syntax = "proto3";
package otpki.public.issuance.v1;

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "otpki/common/api/query/v1/query.proto";
import "otpki/common/issuance/publisher/v1/publisher.proto";

// -- Publisher Configs

message CreatePublisherConfigRequest {
  common.issuance.publisher.v1.PublisherConfig config = 1 [(buf.validate.field).required = true];
}

message CreatePublisherConfigResponse {
  int64 id = 1;
}

message GetPublisherConfigRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetPublisherConfigResponse {
  common.issuance.publisher.v1.PublisherConfig config = 1;
}

message UpdatePublisherConfigRequest {
  common.issuance.publisher.v1.PublisherConfig config = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message UpdatePublisherConfigResponse {}

message DeletePublisherConfigRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message DeletePublisherConfigResponse {}

message GetPublisherConfigListRequest {
  common.api.query.v1.PaginationRequest pagination = 1;
}

message GetPublisherConfigListResponse {
  repeated common.issuance.publisher.v1.PublisherConfig data = 1;
  common.api.query.v1.PaginationResponse pagination = 2;
}

// -- CRL Publishers

message CreateCrlPublisherRequest {
  common.issuance.publisher.v1.CrlPublisher publisher = 1;
}
message CreateCrlPublisherResponse {
  int64 id = 1;
}

message DeleteCrlPublisherRequest {
  int64 publisher_id = 1 [(buf.validate.field).int64.gt = 0];
}
message DeleteCrlPublisherResponse {}

message GetCrlPublisherListRequest {
  common.api.query.v1.PaginationRequest pagination = 1;
}

message GetCrlPublisherListResponse {
  repeated common.issuance.publisher.v1.CrlPublisher data = 1;
  common.api.query.v1.PaginationResponse pagination = 2;
}

// -- Certificate Publishers
message CreateCertificatePublisherRequest {
  common.issuance.publisher.v1.CertificatePublisher publisher = 1;
}
message CreateCertificatePublisherResponse {
  int64 id = 1;
}

message DeleteCertificatePublisherRequest {
  int64 publisher_id = 1 [(buf.validate.field).int64.gt = 0];
}
message DeleteCertificatePublisherResponse {}

message GetCertificatePublisherListRequest {
  common.api.query.v1.PaginationRequest pagination = 1;
}

message GetCertificatePublisherListResponse {
  repeated common.issuance.publisher.v1.CertificatePublisher data = 1;
  common.api.query.v1.PaginationResponse pagination = 2;
}
