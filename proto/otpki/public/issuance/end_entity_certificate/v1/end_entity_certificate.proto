syntax = "proto3";
package otpki.public.issuance.end_entity_certificate.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "otpki/common/api/query/v1/query.proto";
import "otpki/common/core/end_entity_certificate/v1/end_entity_certificate.proto";
import "otpki/common/x509/v1/x509.proto";

message GetEndEntityCertificateBySerialNumberRequest {
  bytes serial_number = 1 [(buf.validate.field).required = true];
  string end_entity_id = 2 [(buf.validate.field).string.uuid = true]; // this param does not do anything, it's for the path to satisfy a pattern
}

message GetEndEntityCertificateBySerialNumberResponse {
  common.core.end_entity_certificate.v1.EndEntityCertificate end_entity_certificate = 1;
}

message GetEndEntityCertificatesRequest {
  string end_entity_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message GetEndEntityCertificatesResponse {
  repeated common.core.end_entity_certificate.v1.EndEntityCertificate end_entity_certificates = 1;
}

message GetEndEntityCertificateListRequest {
  common.api.query.v1.PaginationRequest pagination = 1;
}

message GetEndEntityCertificateListResponse {
  repeated common.core.end_entity_certificate.v1.EndEntityCertificate data = 1;
  common.api.query.v1.PaginationResponse pagination = 2;
}

message RevokeEndEntityCertificateRequest {
  string end_entity_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
  string issued_certificate_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
  common.x509.v1.RevocationReasonCode revocation_reason_code = 3;
}

message RevokeEndEntityCertificateResponse {}

service EndEntityCertificateService {
  rpc GetEndEntityCertificateBySerialNumber(GetEndEntityCertificateBySerialNumberRequest) returns (GetEndEntityCertificateBySerialNumberResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/end-entities/{end_entity_id}/certificate/by-serial-number/{serial_number}"};
  }
  rpc GetEndEntityCertificates(GetEndEntityCertificatesRequest) returns (GetEndEntityCertificatesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/end-entities/{end_entity_id}/certificate"};
  }
  rpc GetEndEntityCertificateList(GetEndEntityCertificateListRequest) returns (GetEndEntityCertificateListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      put: "/v1/end-entities/certificates"
      body: "pagination"
      additional_bindings: {get: "/v1/end-entities/certificates"}
    };
  }
  rpc RevokeEndEntityCertificate(RevokeEndEntityCertificateRequest) returns (RevokeEndEntityCertificateResponse) {
    option (google.api.http) = {
      post: "/v1/end-entities/{end_entity_id}/certificate/{issued_certificate_id}/revoke"
      body: "*"
    };
  }
}
