syntax = "proto3";
package otpki.public.issuance.end_entity.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "otpki/common/api/query/v1/query.proto";
import "otpki/common/core/certificate/v1/certificate.proto";
import "otpki/common/core/end_entity/v1/end_entity.proto";

message CreateEndEntityRequest {
  common.core.end_entity.v1.EndEntity end_entity = 1 [(buf.validate.field).required = true];
}

message CreateEndEntityResponse {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetEndEntityRequest {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message GetEndEntityResponse {
  common.core.end_entity.v1.EndEntity end_entity = 1;
}

message GetEndEntityListRequest {
  common.api.query.v1.PaginationRequest pagination = 1;
}

message GetEndEntityListResponse {
  repeated common.core.end_entity.v1.EndEntity data = 1;
  common.api.query.v1.PaginationResponse pagination = 2;
}

message DeleteEndEntityRequest {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message DeleteEndEntityResponse {}

message UpdateEndEntityRequest {
  common.core.end_entity.v1.EndEntity end_entity = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateEndEntityResponse {}

message GetEndEntityCertificatesRequest {
  string end_entity_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message GetEndEntityCertificatesResponse {
  repeated common.core.certificate.v1.Certificate certificates = 1;
}

message RevokeEndEntityRequest {
  string end_entity_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
  // CA provider should know how to convert
  // this string into a revocation reason code
  string revocation_reason_code = 2;
}

message RevokeEndEntityResponse {
  // set when the end entity or certificate profile requires approval for
  // revocation and the request was queued for approval.
  optional string work_item_id = 1 [(buf.validate.field).string.uuid = true];
}

service EndEntityService {
  rpc CreateEndEntity(CreateEndEntityRequest) returns (CreateEndEntityResponse) {
    option (google.api.http) = {
      post: "/v1/end-entities"
      body: "end_entity"
    };
  }

  rpc GetEndEntity(GetEndEntityRequest) returns (GetEndEntityResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/end-entities/{id}"};
  }
  rpc GetEndEntityList(GetEndEntityListRequest) returns (GetEndEntityListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      put: "/v1/end-entities"
      body: "pagination"
      additional_bindings: {get: "/v1/end-entities"}
    };
  }
  rpc DeleteEndEntity(DeleteEndEntityRequest) returns (DeleteEndEntityResponse) {
    option (google.api.http) = {delete: "/v1/end-entities/{id}"};
  }
  rpc UpdateEndEntity(UpdateEndEntityRequest) returns (UpdateEndEntityResponse) {
    option (google.api.http) = {
      put: "/v1/end-entities/{end_entity.id}"
      body: "end_entity"
      additional_bindings: {
        patch: "/v1/end-entities/{end_entity.id}"
        body: "end_entity"
      }
    };
  }
  rpc GetEndEntityCertificates(GetEndEntityCertificatesRequest) returns (GetEndEntityCertificatesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/end-entities/{end_entity_id}/certificates"};
  }
  rpc RevokeEndEntity(RevokeEndEntityRequest) returns (RevokeEndEntityResponse) {
    option (google.api.http) = {
      post: "/v1/end-entities/{end_entity_id}/revoke"
      body: "*"
    };
  }
}
