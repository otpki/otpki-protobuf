syntax = "proto3";

package otpki.public.issuance.smtp_settings.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "otpki/common/api/query/v1/query.proto";
import "otpki/common/core/smtp_settings/v1/smtp_settings.proto";

message CreateSMTPSettingsRequest {
  common.core.smtp_settings.v1.SMTPSettings smtp_settings = 1 [(buf.validate.field).required = true];
}

message CreateSMTPSettingsResponse {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetSMTPSettingsRequest {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message GetSMTPSettingsResponse {
  common.core.smtp_settings.v1.SMTPSettings smtp_settings = 1;
}

message UpdateSMTPSettingsRequest {
  common.core.smtp_settings.v1.SMTPSettings smtp_settings = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateSMTPSettingsResponse {}

message DeleteSMTPSettingsRequest {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message DeleteSMTPSettingsResponse {}

message GetSMTPSettingsListRequest {
  common.api.query.v1.PaginationRequest pagination = 1;
}

message GetSMTPSettingsListResponse {
  repeated common.core.smtp_settings.v1.SMTPSettings data = 1;
  common.api.query.v1.PaginationResponse pagination = 2;
}

service SMTPSettingsService {
  rpc CreateSMTPSettings(CreateSMTPSettingsRequest) returns (CreateSMTPSettingsResponse) {
    option (google.api.http) = {
      post: "/v1/smtp-settings"
      body: "smtp_settings"
    };
  }
  rpc GetSMTPSettings(GetSMTPSettingsRequest) returns (GetSMTPSettingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/smtp-settings/{id}"};
  }
  rpc UpdateSMTPSettings(UpdateSMTPSettingsRequest) returns (UpdateSMTPSettingsResponse) {
    option (google.api.http) = {
      put: "/v1/smtp-settings/{smtp_settings.id}"
      body: "smtp_settings"
      additional_bindings: {
        patch: "/v1/smtp-settings/{smtp_settings.id}"
        body: "smtp_settings"
      }
    };
  }
  rpc DeleteSMTPSettings(DeleteSMTPSettingsRequest) returns (DeleteSMTPSettingsResponse) {
    option (google.api.http) = {delete: "/v1/smtp-settings/{id}"};
  }
  rpc GetSMTPSettingsList(GetSMTPSettingsListRequest) returns (GetSMTPSettingsListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      put: "/v1/smtp-settings"
      body: "pagination"
      additional_bindings: {get: "/v1/smtp-settings"}
    };
  }
}
