syntax = "proto3";
package otpki.public.issuance.secret_share.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";

message SplitSecretRequest {
  string secret = 1;
  int64 threshold = 2 [(buf.validate.field).int64 = {
    gte: 2
    lte: 255
  }];
  int64 shares = 3 [(buf.validate.field).int64 = {
    gte: 2
    lte: 255
  }];
  bool generate_forms = 4;

  option (buf.validate.message).cel = {
    id: "shares_gte_threshold"
    message: "shares must be greater than or equal to threshold"
    expression: "this.shares >= this.threshold"
  };
}

message SplitSecretResponse {
  repeated string shares = 1; // hex strings
  bytes form_zip = 2;
}

message CombineSecretRequest {
  repeated string shares = 1; // hex strings
}

message CombineSecretResponse {
  string secret = 1;
}

service SecretShareService {
  rpc CombineSecret(CombineSecretRequest) returns (CombineSecretResponse) {
    option (google.api.http) = {
      post: "/v1/secret-shares/combine"
      body: "*"
    };
  }
  rpc SplitSecret(SplitSecretRequest) returns (SplitSecretResponse) {
    option (google.api.http) = {
      post: "/v1/secret-shares/split"
      body: "*"
    };
  }
}
