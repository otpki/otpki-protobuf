syntax = "proto3";
package otpki.public.issuance.extended_key_usage.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "otpki/common/api/query/v1/query.proto";
import "otpki/common/core/extended_key_usage/v1/extended_key_usage.proto";

message CreateCustomExtKeyUsageRequest {
  common.core.extended_key_usage.v1.CustomExtKeyUsage key_usage = 1 [(buf.validate.field).required = true];
}

message CreateCustomExtKeyUsageResponse {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetCustomExtKeyUsageRequest {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message GetCustomExtKeyUsageResponse {
  common.core.extended_key_usage.v1.CustomExtKeyUsage key_usage = 1;
}

message UpdateCustomExtKeyUsageRequest {
  common.core.extended_key_usage.v1.CustomExtKeyUsage key_usage = 1 [(buf.validate.field).required = true];
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateCustomExtKeyUsageResponse {}

message DeleteCustomExtKeyUsageRequest {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message DeleteCustomExtKeyUsageResponse {}

message GetCustomExtKeyUsageListRequest {
  common.api.query.v1.PaginationRequest pagination = 1;
}

message GetCustomExtKeyUsageListResponse {
  repeated common.core.extended_key_usage.v1.CustomExtKeyUsage data = 1;
  common.api.query.v1.PaginationResponse pagination = 2;
}

service ExtendedKeyUsageService {
  rpc CreateCustomExtKeyUsage(CreateCustomExtKeyUsageRequest) returns (CreateCustomExtKeyUsageResponse) {
    option (google.api.http) = {
      post: "/v1/custom-ext-key-usages"
      body: "key_usage"
    };
  }
  rpc GetCustomExtKeyUsage(GetCustomExtKeyUsageRequest) returns (GetCustomExtKeyUsageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/custom-ext-key-usages/{id}"};
  }
  rpc UpdateCustomExtKeyUsage(UpdateCustomExtKeyUsageRequest) returns (UpdateCustomExtKeyUsageResponse) {
    option (google.api.http) = {
      put: "/v1/custom-ext-key-usages/{key_usage.id}"
      body: "key_usage"
      additional_bindings: {
        patch: "/v1/custom-ext-key-usages/{key_usage.id}"
        body: "key_usage"
      }
    };
  }
  rpc DeleteCustomExtKeyUsage(DeleteCustomExtKeyUsageRequest) returns (DeleteCustomExtKeyUsageResponse) {
    option (google.api.http) = {delete: "/v1/custom-ext-key-usages/{id}"};
  }
  rpc GetCustomExtKeyUsageList(GetCustomExtKeyUsageListRequest) returns (GetCustomExtKeyUsageListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      put: "/v1/custom-ext-key-usages"
      body: "pagination"
      additional_bindings: {get: "/v1/custom-ext-key-usages"}
    };
  }
}
