syntax = "proto3";
package otpki.public.issuance.publisher.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "otpki/common/api/query/v1/query.proto";
import "otpki/common/core/publisher/v1/publisher.proto";

// -- Publisher Configs

message CreatePublisherConfigRequest {
  common.core.publisher.v1.PublisherConfig config = 1 [(buf.validate.field).required = true];
}

message CreatePublisherConfigResponse {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetPublisherConfigRequest {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message GetPublisherConfigResponse {
  common.core.publisher.v1.PublisherConfig config = 1;
}

message UpdatePublisherConfigRequest {
  common.core.publisher.v1.PublisherConfig config = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message UpdatePublisherConfigResponse {}

message DeletePublisherConfigRequest {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message DeletePublisherConfigResponse {}

message GetPublisherConfigListRequest {
  common.api.query.v1.PaginationRequest pagination = 1;
}

message GetPublisherConfigListResponse {
  repeated common.core.publisher.v1.PublisherConfig data = 1;
  common.api.query.v1.PaginationResponse pagination = 2;
}

message TestPublisherConnectionRequest {
  common.core.publisher.v1.PublisherConfig config = 1 [(buf.validate.field).required = true];
}

message TestPublisherConnectionResponse {}

message TestPublisherPublishRequest {
  common.core.publisher.v1.PublisherConfig config = 1 [(buf.validate.field).required = true];
  common.core.publisher.v1.PkiArtifact artifact = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message TestPublisherPublishResponse {}

// -- CRL Publishers

message CreateCrlPublisherRequest {
  common.core.publisher.v1.CrlPublisher publisher = 1;
}
message CreateCrlPublisherResponse {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteCrlPublisherRequest {
  string publisher_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}
message DeleteCrlPublisherResponse {}

message GetCrlPublisherListRequest {
  common.api.query.v1.PaginationRequest pagination = 1;
}

message GetCrlPublisherListResponse {
  repeated common.core.publisher.v1.CrlPublisher data = 1;
  common.api.query.v1.PaginationResponse pagination = 2;
}

// -- Certificate Publishers
message CreateCertificatePublisherRequest {
  common.core.publisher.v1.CertificatePublisher publisher = 1;
}
message CreateCertificatePublisherResponse {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteCertificatePublisherRequest {
  string publisher_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}
message DeleteCertificatePublisherResponse {}

message GetCertificatePublisherListRequest {
  common.api.query.v1.PaginationRequest pagination = 1;
}

message GetCertificatePublisherListResponse {
  repeated common.core.publisher.v1.CertificatePublisher data = 1;
  common.api.query.v1.PaginationResponse pagination = 2;
}

service PublisherService {
  // CRL Publishers
  rpc CreateCrlPublisher(CreateCrlPublisherRequest) returns (CreateCrlPublisherResponse) {
    option (google.api.http) = {
      post: "/v1/publishers/crl"
      body: "*"
    };
  }
  rpc DeleteCrlPublisher(DeleteCrlPublisherRequest) returns (DeleteCrlPublisherResponse) {
    option (google.api.http) = {delete: "/v1/publishers/crl/{publisher_id}"};
  }
  rpc GetCrlPublisherList(GetCrlPublisherListRequest) returns (GetCrlPublisherListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      put: "/v1/publishers/crl"
      body: "pagination"
      additional_bindings: {get: "/v1/publishers/crl"}
    };
  }

  // Cert Publishers
  rpc CreateCertificatePublisher(CreateCertificatePublisherRequest) returns (CreateCertificatePublisherResponse) {
    option (google.api.http) = {
      post: "/v1/publishers/certificate"
      body: "*"
    };
  }
  rpc DeleteCertificatePublisher(DeleteCertificatePublisherRequest) returns (DeleteCertificatePublisherResponse) {
    option (google.api.http) = {delete: "/v1/publishers/certificate/{publisher_id}"};
  }
  rpc GetCertificatePublisherList(GetCertificatePublisherListRequest) returns (GetCertificatePublisherListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      put: "/v1/publishers/certificate"
      body: "pagination"
      additional_bindings: {get: "/v1/publishers/certificate"}
    };
  }

  // Publisher Configs
  rpc CreatePublisherConfig(CreatePublisherConfigRequest) returns (CreatePublisherConfigResponse) {
    option (google.api.http) = {
      post: "/v1/publishers/configs"
      body: "config"
    };
  }
  rpc GetPublisherConfig(GetPublisherConfigRequest) returns (GetPublisherConfigResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/publishers/configs/{id}"};
  }
  rpc UpdatePublisherConfig(UpdatePublisherConfigRequest) returns (UpdatePublisherConfigResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      put: "/v1/publishers/configs/{config.id}"
      body: "config"
      additional_bindings: {
        patch: "/v1/publishers/configs/{config.id}"
        body: "config"
      }
    };
  }
  rpc DeletePublisherConfig(DeletePublisherConfigRequest) returns (DeletePublisherConfigResponse) {
    option (google.api.http) = {delete: "/v1/publishers/configs/{id}"};
  }
  rpc GetPublisherConfigList(GetPublisherConfigListRequest) returns (GetPublisherConfigListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      put: "/v1/publishers/configs"
      body: "pagination"
      additional_bindings: {get: "/v1/publishers/configs"}
    };
  }
  rpc TestPublisherConnection(TestPublisherConnectionRequest) returns (TestPublisherConnectionResponse) {
    option (google.api.http) = {
      post: "/v1/publishers/configs/test"
      body: "config"
    };
  }
  rpc TestPublisherPublish(TestPublisherPublishRequest) returns (TestPublisherPublishResponse) {
    option (google.api.http) = {
      post: "/v1/publishers/configs/test-publish"
      body: "*"
    };
  }
}
