syntax = "proto3";
package otpki.public.issuance.publisher.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "otpki/common/api/query/v1/query.proto";
import "otpki/common/core/publisher/v1/publisher.proto";

// -- Publishers

message CreatePublisherRequest {
  common.core.publisher.v1.Publisher publisher = 1 [(buf.validate.field).required = true];
}

message CreatePublisherResponse {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetPublisherRequest {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message GetPublisherResponse {
  common.core.publisher.v1.Publisher publisher = 1;
}

message UpdatePublisherRequest {
  common.core.publisher.v1.Publisher publisher = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message UpdatePublisherResponse {}

message DeletePublisherRequest {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message DeletePublisherResponse {}

message GetPublisherListRequest {
  common.api.query.v1.PaginationRequest pagination = 1;
}

message GetPublisherListResponse {
  repeated common.core.publisher.v1.Publisher data = 1;
  common.api.query.v1.PaginationResponse pagination = 2;
}

// -- Testing

message TestPublisherConnectionRequest {
  common.core.publisher.v1.Publisher publisher = 1 [(buf.validate.field).required = true];
}

message TestPublisherConnectionResponse {}

message TestPublisherPublishRequest {
  common.core.publisher.v1.Publisher publisher = 1 [(buf.validate.field).required = true];
  // Which trigger event to simulate
  common.core.publisher.v1.PublisherTriggerEvent trigger_event = 2 [(buf.validate.field).enum.defined_only = true];
}

message TestPublisherPublishResponse {}

service PublisherService {
  rpc CreatePublisher(CreatePublisherRequest) returns (CreatePublisherResponse) {
    option (google.api.http) = {
      post: "/v1/issuance/publishers"
      body: "publisher"
    };
  }
  rpc GetPublisher(GetPublisherRequest) returns (GetPublisherResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/issuance/publishers/{id}"};
  }
  rpc UpdatePublisher(UpdatePublisherRequest) returns (UpdatePublisherResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      put: "/v1/issuance/publishers/{publisher.id}"
      body: "publisher"
      additional_bindings: {
        patch: "/v1/issuance/publishers/{publisher.id}"
        body: "publisher"
      }
    };
  }
  rpc DeletePublisher(DeletePublisherRequest) returns (DeletePublisherResponse) {
    option (google.api.http) = {delete: "/v1/issuance/publishers/{id}"};
  }
  rpc GetPublisherList(GetPublisherListRequest) returns (GetPublisherListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      put: "/v1/issuance/publishers"
      body: "pagination"
      additional_bindings: {get: "/v1/issuance/publishers"}
    };
  }
  rpc TestPublisherConnection(TestPublisherConnectionRequest) returns (TestPublisherConnectionResponse) {
    option (google.api.http) = {
      post: "/v1/issuance/publishers/test"
      body: "publisher"
    };
  }
  rpc TestPublisherPublish(TestPublisherPublishRequest) returns (TestPublisherPublishResponse) {
    option (google.api.http) = {
      post: "/v1/issuance/publishers/test-publish"
      body: "*"
    };
  }
}
