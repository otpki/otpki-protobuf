syntax = "proto3";
package otpki.public.enrollment.plugin.protocol.acme.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "otpki/common/api/v1/string_enum.proto";
import "otpki/common/enrollment/plugin/protocol/acme/v1/enum.proto";
import "otpki/public/enrollment/plugin/protocol/acme/v1/error.proto";
// Request and response message definitions

message AccountUpdateRequest { // WIP
  repeated string contact = 1;
  common.enrollment.plugin.protocol.acme.v1.AccountStatus status = 2 [(common.api.v1.string_enum) = true];
}

// message RevocationRequest { // WIP
//   bytes certificate = 1;
//   optional int32 reason = 2;
// }

// message KeyChangeRequest { // WIP
//   string account = 1;
//   google.protobuf.Struct old_key = 2; // JWK
//   google.protobuf.Struct new_key = 3;
// }

// Directory
message GetDirectoryRequest {
  string name = 1;
}

// buf:lint:ignore FIELD_LOWER_SNAKE_CASE
message GetDirectoryResponse {
  string newNonce = 1;
  string newAccount = 2;
  string newOrder = 3;
  string revokeCert = 4;
  string keyChange = 5;
  string newAuthz = 6;
  DirectoryMeta meta = 7;
}

// buf:lint:ignore FIELD_LOWER_SNAKE_CASE
message DirectoryMeta {
  string termsOfService = 1;
  string website = 2;
  repeated string caaIdentities = 3;
  bool externalAccountRequired = 4;
}

// Nonce
message GetNewNonceRequest {
  string name = 1;
}
message GetNewNonceResponse {}

// Accounts
message CreateOrGetAccountRequest {
  string name = 1;
  bytes data = 2;
}
message GetOrUpdateAccountRequest {
  int64 id = 1;
  string name = 2;
  bytes data = 3;
}

// A generic account struct for internal use
// buf:lint:ignore FIELD_LOWER_SNAKE_CASE
message AccountData {
  string id = 1;
  repeated string contact = 2;
  common.enrollment.plugin.protocol.acme.v1.AccountStatus status = 3 [(common.api.v1.string_enum) = true];
  bool termsOfServiceAgreed = 4;
  string orders = 5; // URL to listorders
}

// buf:lint:ignore FIELD_LOWER_SNAKE_CASE
message CreateOrGetAccountResponse {
  string id = 1;
  repeated string contact = 2;
  common.enrollment.plugin.protocol.acme.v1.AccountStatus status = 3 [(common.api.v1.string_enum) = true];
  bool termsOfServiceAgreed = 4;
  string orders = 5; // URL to listorders
}

// buf:lint:ignore FIELD_LOWER_SNAKE_CASE
message GetOrUpdateAccountResponse {
  string id = 1;
  repeated string contact = 2;
  common.enrollment.plugin.protocol.acme.v1.AccountStatus status = 3 [(common.api.v1.string_enum) = true];
  bool termsOfServiceAgreed = 4;
  string orders = 5; // URL to listorders
}

// Keychange
message KeyChangeRequest {
  string name = 1;
  bytes data = 2;
}

// buf:lint:ignore FIELD_LOWER_SNAKE_CASE
message KeyChangeResponse {
  string id = 1;
  repeated string contact = 2;
  common.enrollment.plugin.protocol.acme.v1.AccountStatus status = 3 [(common.api.v1.string_enum) = true];
  bool termsOfServiceAgreed = 4;
  string orders = 5; // URL to listorders
}

// ORDERS
message CreateOrderRequest {
  string name = 1;
  bytes data = 2;
}
message GetOrderRequest {
  int64 id = 1;
  string name = 2;
  bytes data = 3;
}
message ListOrdersRequest {
  int64 id = 1;
  string name = 2;
  bytes data = 3;
}
message FinalizeOrderRequest {
  int64 id = 1;
  string name = 2;
  bytes data = 3;
}
message ListOrdersResponse {
  repeated OrderURL orders = 1;
  string next_cursor = 2; // Pagination cursor for next page
}

message OrderURL {
  string url = 1;
}

// buf:lint:ignore FIELD_LOWER_SNAKE_CASE
message CreateOrderResponse {
  int64 id = 1;
  common.enrollment.plugin.protocol.acme.v1.OrderStatus status = 2 [(common.api.v1.string_enum) = true];
  google.protobuf.Timestamp expires = 3;
  repeated Identifier identifiers = 4 [(common.api.v1.string_enum) = true];
  google.protobuf.Timestamp notBefore = 5;
  google.protobuf.Timestamp notAfter = 6;
  google.protobuf.Struct error = 7;
  repeated string authorizations = 8; // URLs to authorizations
  string finalize = 9; // URL to finalize endpoint
  string certificate = 10; // URL to certificate when issued
}

// buf:lint:ignore FIELD_LOWER_SNAKE_CASE
message GetOrderResponse {
  int64 id = 1;
  common.enrollment.plugin.protocol.acme.v1.OrderStatus status = 2 [(common.api.v1.string_enum) = true];
  google.protobuf.Timestamp expires = 3;
  repeated Identifier identifiers = 4 [(common.api.v1.string_enum) = true];
  google.protobuf.Timestamp notBefore = 5;
  google.protobuf.Timestamp notAfter = 6;
  google.protobuf.Struct error = 7;
  repeated string authorizations = 8; // URLs to authorizations
  string finalize = 9; // URL to finalize endpoint
  string certificate = 10; // URL to certificate when issued
}

// buf:lint:ignore FIELD_LOWER_SNAKE_CASE
message FinalizeOrderResponse {
  int64 id = 1;
  common.enrollment.plugin.protocol.acme.v1.OrderStatus status = 2 [(common.api.v1.string_enum) = true];
  google.protobuf.Timestamp expires = 3;
  repeated Identifier identifiers = 4 [(common.api.v1.string_enum) = true];
  google.protobuf.Timestamp notBefore = 5;
  google.protobuf.Timestamp notAfter = 6;
  google.protobuf.Struct error = 7;
  repeated string authorizations = 8; // URLs to authorizations
  string finalize = 9; // URL to finalize endpoint
  string certificate = 10; // URL to certificate when issued
}

//AUTHZ
message GetOrDeactivateAuthorizationRequest {
  int64 id = 1;
  string name = 2;
  bytes data = 3;
}
message GetOrDeactivateAuthorizationResponse {
  int64 id = 1;
  common.enrollment.plugin.protocol.acme.v1.AuthorizationStatus status = 2 [(common.api.v1.string_enum) = true];
  google.protobuf.Timestamp expires = 3;
  Identifier identifier = 4 [(common.api.v1.string_enum) = true];
  repeated Challenge challenges = 5;
  bool wildcard = 6;
}

// Challenge
message GetOrValidateChallengeRequest {
  int64 id = 1;
  string name = 2;
  bytes data = 3;
}
message Challenge {
  int64 id = 1;
  common.enrollment.plugin.protocol.acme.v1.ChallengeType type = 2 [(common.api.v1.string_enum) = true];
  string url = 3;
  common.enrollment.plugin.protocol.acme.v1.ChallengeStatus status = 4 [(common.api.v1.string_enum) = true];
  google.protobuf.Timestamp validated = 5;
  google.protobuf.Struct error = 6;
  string token = 7;
}

message GetOrValidateChallengeResponse {
  int64 id = 1;
  common.enrollment.plugin.protocol.acme.v1.ChallengeType type = 2 [(common.api.v1.string_enum) = true];
  string url = 3;
  common.enrollment.plugin.protocol.acme.v1.ChallengeStatus status = 4 [(common.api.v1.string_enum) = true];
  google.protobuf.Timestamp validated = 5;
  google.protobuf.Struct error = 6;
  string token = 7;
}

// Certificates

message GetCertificateRequest {
  int64 id = 1;
  string name = 2;
  bytes data = 3;
}
message RevokeCertificateRequest {
  string name = 1;
  bytes data = 2;
}
message RevokeCertificateResponse {}
