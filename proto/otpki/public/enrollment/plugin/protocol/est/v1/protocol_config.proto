syntax = "proto3";
package otpki.public.enrollment.plugin.protocol.est.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "otpki/common/api/query/v1/query.proto";
import "otpki/common/enrollment/plugin/protocol/est/v1/est.proto";

message CreateESTProtocolConfigRequest {
  common.enrollment.plugin.protocol.est.v1.ESTProtocolConfig protocol_config = 1 [(buf.validate.field).required = true];
}

message CreateESTProtocolConfigResponse {
  int64 id = 1;
}

message GetESTProtocolConfigRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetESTProtocolConfigResponse {
  common.enrollment.plugin.protocol.est.v1.ESTProtocolConfig protocol_config = 1;
}

message UpdateESTProtocolConfigRequest {
  common.enrollment.plugin.protocol.est.v1.ESTProtocolConfig protocol_config = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateESTProtocolConfigResponse {}

message DeleteESTProtocolConfigRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message DeleteESTProtocolConfigResponse {}

message GetESTProtocolConfigListRequest {
  common.api.query.v1.PaginationRequest pagination = 1;
}

message GetESTProtocolConfigListResponse {
  repeated common.enrollment.plugin.protocol.est.v1.ESTProtocolConfig data = 1;
  common.api.query.v1.PaginationResponse pagination = 2;
}

service ESTProtocolConfigService {
  rpc CreateESTProtocolConfig(CreateESTProtocolConfigRequest) returns (CreateESTProtocolConfigResponse) {
    option (google.api.http) = {
      post: "/v1/protocol-configs/est"
      body: "protocol_config"
    };
  }

  rpc GetESTProtocolConfig(GetESTProtocolConfigRequest) returns (GetESTProtocolConfigResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/protocol-configs/est/{id}"};
  }

  rpc UpdateESTProtocolConfig(UpdateESTProtocolConfigRequest) returns (UpdateESTProtocolConfigResponse) {
    option (google.api.http) = {
      put: "/v1/protocol-configs/est/{protocol_config.id}"
      body: "protocol_config"
      additional_bindings: {
        patch: "/v1/protocol-configs/est/{protocol_config.id}"
        body: "protocol_config"
      }
    };
  }

  rpc DeleteESTProtocolConfig(DeleteESTProtocolConfigRequest) returns (DeleteESTProtocolConfigResponse) {
    option (google.api.http) = {delete: "/v1/protocol-configs/est/{id}"};
  }

  rpc GetESTProtocolConfigList(GetESTProtocolConfigListRequest) returns (GetESTProtocolConfigListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      put: "/v1/protocol-configs/est"
      body: "pagination"
      additional_bindings: {get: "/v1/protocol-configs/est"}
    };
  }
}
