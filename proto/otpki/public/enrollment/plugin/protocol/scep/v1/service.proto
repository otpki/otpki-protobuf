syntax = "proto3";
package otpki.public.enrollment.plugin.protocol.scep.v1;

import "google/api/annotations.proto";
import "google/api/httpbody.proto";

message SCEPMessage {
  bytes data = 1;
  string operation = 2;
  string name = 3; // CA name
  optional string message = 4;
}

service SCEPService {
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc SCEPEndpoint(SCEPMessage) returns (google.api.HttpBody) {
    option (google.api.http) = {
      get: "/v1/scep/{name}/cgi-bin/pkiclient.exe"
      additional_bindings: {
        post: "/v1/scep/{name}/cgi-bin/pkiclient.exe"
        body: "data"
      }
    };
  }
}
