syntax = "proto3";
package otpki.public.enrollment.plugin.protocol.scep.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "otpki/common/api/query/v1/query.proto";
import "otpki/common/enrollment/plugin/protocol/scep/v1/scep.proto";

message CreateSCEPProtocolConfigRequest {
  common.enrollment.plugin.protocol.scep.v1.SCEPProtocolConfig protocol_config = 1 [(buf.validate.field).required = true];
}

message CreateSCEPProtocolConfigResponse {
  int64 id = 1;
}

message GetSCEPProtocolConfigRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetSCEPProtocolConfigResponse {
  common.enrollment.plugin.protocol.scep.v1.SCEPProtocolConfig protocol_config = 1;
}

message UpdateSCEPProtocolConfigRequest {
  common.enrollment.plugin.protocol.scep.v1.SCEPProtocolConfig protocol_config = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateSCEPProtocolConfigResponse {}

message DeleteSCEPProtocolConfigRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message DeleteSCEPProtocolConfigResponse {}

message GetSCEPProtocolConfigListRequest {
  common.api.query.v1.PaginationRequest pagination = 1;
}

message GetSCEPProtocolConfigListResponse {
  repeated common.enrollment.plugin.protocol.scep.v1.SCEPProtocolConfig data = 1;
  common.api.query.v1.PaginationResponse pagination = 2;
}

service SCEPProtocolConfigService {
  rpc CreateSCEPProtocolConfig(CreateSCEPProtocolConfigRequest) returns (CreateSCEPProtocolConfigResponse) {
    option (google.api.http) = {
      post: "/v1/protocol-configs/scep"
      body: "protocol_config"
    };
  }

  rpc GetSCEPProtocolConfig(GetSCEPProtocolConfigRequest) returns (GetSCEPProtocolConfigResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/protocol-configs/scep/{id}"};
  }

  rpc UpdateSCEPProtocolConfig(UpdateSCEPProtocolConfigRequest) returns (UpdateSCEPProtocolConfigResponse) {
    option (google.api.http) = {
      put: "/v1/protocol-configs/scep/{protocol_config.id}"
      body: "protocol_config"
      additional_bindings: {
        patch: "/v1/protocol-configs/scep/{protocol_config.id}"
        body: "protocol_config"
      }
    };
  }

  rpc DeleteSCEPProtocolConfig(DeleteSCEPProtocolConfigRequest) returns (DeleteSCEPProtocolConfigResponse) {
    option (google.api.http) = {delete: "/v1/protocol-configs/scep/{id}"};
  }

  rpc GetSCEPProtocolConfigList(GetSCEPProtocolConfigListRequest) returns (GetSCEPProtocolConfigListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      put: "/v1/protocol-configs/scep"
      body: "pagination"
      additional_bindings: {get: "/v1/protocol-configs/scep"}
    };
  }
}
