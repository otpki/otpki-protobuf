syntax = "proto3";
package otpki.public.enrollment.plugin.protocol.msae.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "otpki/common/api/query/v1/query.proto";
import "otpki/common/enrollment/plugin/protocol/msae/v1/msae.proto";

message CreateMSAEProtocolConfigRequest {
  common.enrollment.plugin.protocol.msae.v1.MSAEProtocolConfig protocol_config = 1 [(buf.validate.field).required = true];
}

message CreateMSAEProtocolConfigResponse {
  int64 id = 1;
}

message GetMSAEProtocolConfigRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetMSAEProtocolConfigResponse {
  common.enrollment.plugin.protocol.msae.v1.MSAEProtocolConfig protocol_config = 1;
}

message UpdateMSAEProtocolConfigRequest {
  common.enrollment.plugin.protocol.msae.v1.MSAEProtocolConfig protocol_config = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateMSAEProtocolConfigResponse {}

message DeleteMSAEProtocolConfigRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message DeleteMSAEProtocolConfigResponse {}

message GetMSAEProtocolConfigListRequest {
  common.api.query.v1.PaginationRequest pagination = 1;
}

message GetMSAEProtocolConfigListResponse {
  repeated common.enrollment.plugin.protocol.msae.v1.MSAEProtocolConfig data = 1;
  common.api.query.v1.PaginationResponse pagination = 2;
}

message TestMSAEProtocolConfigRequest {
  common.enrollment.plugin.protocol.msae.v1.MSAEProtocolConfig protocol_config = 1 [(buf.validate.field).required = true];
}

message TestMSAEProtocolConfigResponse {}

service MSAEProtocolConfigService {
  rpc CreateMSAEProtocolConfig(CreateMSAEProtocolConfigRequest) returns (CreateMSAEProtocolConfigResponse) {
    option (google.api.http) = {
      post: "/v1/protocol-configs/msae"
      body: "protocol_config"
    };
  }

  rpc GetMSAEProtocolConfig(GetMSAEProtocolConfigRequest) returns (GetMSAEProtocolConfigResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/protocol-configs/msae/{id}"};
  }

  rpc UpdateMSAEProtocolConfig(UpdateMSAEProtocolConfigRequest) returns (UpdateMSAEProtocolConfigResponse) {
    option (google.api.http) = {
      put: "/v1/protocol-configs/msae/{protocol_config.id}"
      body: "protocol_config"
      additional_bindings: {
        patch: "/v1/protocol-configs/msae/{protocol_config.id}"
        body: "protocol_config"
      }
    };
  }

  rpc DeleteMSAEProtocolConfig(DeleteMSAEProtocolConfigRequest) returns (DeleteMSAEProtocolConfigResponse) {
    option (google.api.http) = {delete: "/v1/protocol-configs/msae/{id}"};
  }

  rpc GetMSAEProtocolConfigList(GetMSAEProtocolConfigListRequest) returns (GetMSAEProtocolConfigListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      put: "/v1/protocol-configs/msae"
      body: "pagination"
      additional_bindings: {get: "/v1/protocol-configs/msae"}
    };
  }

  rpc TestMSAEProtocolConfig(TestMSAEProtocolConfigRequest) returns (TestMSAEProtocolConfigResponse) {
    option (google.api.http) = {
      post: "/v1/protocol-configs/msae/test"
      body: "protocol_config"
    };
  }
}
