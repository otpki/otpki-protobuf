syntax = "proto3";
package otpki.public.enrollment.plugin.protocol.msae.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "otpki/common/api/query/v1/query.proto";
import "otpki/common/enrollment/plugin/protocol/msae/certificate_template/v1/certificate_template.proto";

message GetCertificateTemplateRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetCertificateTemplateResponse {
  common.enrollment.plugin.protocol.msae.certificate_template.v1.CertificateTemplate certificate_template = 1;
}

message GetCertificateTemplateListRequest {
  common.api.query.v1.PaginationRequest pagination = 1;
}

message GetCertificateTemplateListResponse {
  repeated common.enrollment.plugin.protocol.msae.certificate_template.v1.CertificateTemplate data = 1;
  common.api.query.v1.PaginationResponse pagination = 2;
}

service CertificateTemplateService {
  rpc GetCertificateTemplate(GetCertificateTemplateRequest) returns (GetCertificateTemplateResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/certificatetemplate/{id}"};
  }

  rpc GetCertificateTemplateList(GetCertificateTemplateListRequest) returns (GetCertificateTemplateListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      put: "/v1/certificatetemplates"
      body: "pagination"
      additional_bindings: {get: "/v1/certificatetemplates"}
    };
  }
}
