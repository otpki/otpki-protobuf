syntax = "proto3";
package otpki.public.enrollment.plugin.protocol.msae.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/httpbody.proto";

// 'name' field must always be tagged as field 1
// this is for kerberos to perform auth before message
// is unmarshalled

message GetPoliciesRequest {
  string name = 1 [(buf.validate.field).required = true];
  bytes envelope = 2;
}

message RequestSecurityTokenRequest {
  string name = 1 [(buf.validate.field).required = true];
  bytes envelope = 2;
}

service MSAEService {
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc GetPolicies(GetPoliciesRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {
      post: "/v1/msae/{name}/CEP"
      body: "envelope"
    };
  }

  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc RequestSecurityToken(RequestSecurityTokenRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {
      post: "/v1/msae/{name}/CES"
      body: "envelope"
    };
  }
}
