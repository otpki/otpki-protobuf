syntax = "proto3";
package otpki.public.enrollment.plugin.protocol.cmp.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "otpki/common/api/query/v1/query.proto";
import "otpki/common/enrollment/plugin/protocol/cmp/v1/cmp.proto";

message CreateCMPProtocolConfigRequest {
  common.enrollment.plugin.protocol.cmp.v1.CMPProtocolConfig protocol_config = 1 [(buf.validate.field).required = true];
}

message CreateCMPProtocolConfigResponse {
  int64 id = 1;
}

message GetCMPProtocolConfigRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetCMPProtocolConfigResponse {
  common.enrollment.plugin.protocol.cmp.v1.CMPProtocolConfig protocol_config = 1;
}

message UpdateCMPProtocolConfigRequest {
  common.enrollment.plugin.protocol.cmp.v1.CMPProtocolConfig protocol_config = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateCMPProtocolConfigResponse {}

message DeleteCMPProtocolConfigRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message DeleteCMPProtocolConfigResponse {}

message GetCMPProtocolConfigListRequest {
  common.api.query.v1.PaginationRequest pagination = 1;
}

message GetCMPProtocolConfigListResponse {
  repeated common.enrollment.plugin.protocol.cmp.v1.CMPProtocolConfig data = 1;
  common.api.query.v1.PaginationResponse pagination = 2;
}

service CMPProtocolConfigService {
  rpc CreateCMPProtocolConfig(CreateCMPProtocolConfigRequest) returns (CreateCMPProtocolConfigResponse) {
    option (google.api.http) = {
      post: "/v1/protocol-configs/cmp"
      body: "protocol_config"
    };
  }

  rpc GetCMPProtocolConfig(GetCMPProtocolConfigRequest) returns (GetCMPProtocolConfigResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/protocol-configs/cmp/{id}"};
  }

  rpc UpdateCMPProtocolConfig(UpdateCMPProtocolConfigRequest) returns (UpdateCMPProtocolConfigResponse) {
    option (google.api.http) = {
      put: "/v1/protocol-configs/cmp/{protocol_config.id}"
      body: "protocol_config"
      additional_bindings: {
        patch: "/v1/protocol-configs/cmp/{protocol_config.id}"
        body: "protocol_config"
      }
    };
  }

  rpc DeleteCMPProtocolConfig(DeleteCMPProtocolConfigRequest) returns (DeleteCMPProtocolConfigResponse) {
    option (google.api.http) = {delete: "/v1/protocol-configs/cmp/{id}"};
  }

  rpc GetCMPProtocolConfigList(GetCMPProtocolConfigListRequest) returns (GetCMPProtocolConfigListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      put: "/v1/protocol-configs/cmp"
      body: "pagination"
      additional_bindings: {get: "/v1/protocol-configs/cmp"}
    };
  }
}
