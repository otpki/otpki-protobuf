syntax = "proto3";
package otpki.public.enrollment.enroller.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "otpki/common/core/end_entity/v1/end_entity.proto";
import "otpki/common/core/enroller/v1/enroller.proto";

message EnrollRequest {
  common.core.enroller.v1.EnrollmentRequest enrollment = 1 [(buf.validate.field).required = true];
  // set when creating an ephemeral or persistent end entity inline
  common.core.end_entity.v1.EndEntity end_entity = 2;
  string login_id = 3;
  string password = 4;
}

message EnrollResponse {
  common.core.enroller.v1.EnrollmentResponse enrollment = 1;
}

message GetEnrollmentStatusRequest {
  // identify the pending/issued enrollment by end entity ID
  string end_entity_id = 1 [(buf.validate.field).string.uuid = true];
  // or by the end entity's login ID
  string login_id = 2;
  // or by the request ID that was returned when the enrollment was deferred
  string request_id = 3 [(buf.validate.field).string.uuid = true];
}

message GetEnrollmentStatusResponse {
  common.core.enroller.v1.EnrollmentResponse enrollment = 1;
}

service EnrollerService {
  rpc Enroll(EnrollRequest) returns (EnrollResponse) {
    option (google.api.http) = {
      post: "/v1/enrollment"
      body: "*"
    };
  }
  rpc GetEnrollmentStatus(GetEnrollmentStatusRequest) returns (GetEnrollmentStatusResponse) {
    option (google.api.http) = {get: "/v1/enrollment/status"};
  }
}
