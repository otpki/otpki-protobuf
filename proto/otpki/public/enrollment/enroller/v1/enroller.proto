syntax = "proto3";
package otpki.public.enrollment.enroller.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "otpki/common/api/query/v1/query.proto";
import "otpki/common/core/end_entity/v1/end_entity.proto";
import "otpki/common/core/enroller/v1/enroller.proto";

message CreateEnrollmentAttemptRequest {
  // Exactly one of enrollment_attempt.end_entity_id or end_entity must be set.
  common.core.enroller.v1.EnrollmentAttempt enrollment_attempt = 1 [(buf.validate.field).required = true];
  common.core.end_entity.v1.EndEntity end_entity = 2;
}

message CreateEnrollmentAttemptResponse {
  common.core.enroller.v1.EnrollmentResponse enrollment_response = 1;
}

message CreateEnrollmentAttemptForExistingEndEntityRequest {
  // Exactly one of enrollment_attempt.end_entity_id or login_id should be set.
  common.core.enroller.v1.EnrollmentAttempt enrollment_attempt = 1 [(buf.validate.field).required = true];
  string login_id = 2;
  string password = 3;
}

message CreateEnrollmentAttemptForExistingEndEntityResponse {
  common.core.enroller.v1.EnrollmentResponse enrollment_response = 1;
}

message GetEnrollmentAttemptListRequest {
  common.api.query.v1.PaginationRequest pagination = 1;
}

message GetEnrollmentAttemptListResponse {
  repeated common.core.enroller.v1.EnrollmentAttempt data = 1;
  common.api.query.v1.PaginationResponse pagination = 2;
}

service EnrollerService {
  rpc CreateEnrollmentAttempt(CreateEnrollmentAttemptRequest) returns (CreateEnrollmentAttemptResponse) {
    option (google.api.http) = {
      post: "/v1/enrollment"
      body: "*"
    };
  }
  rpc CreateEnrollmentAttemptForExistingEndEntity(CreateEnrollmentAttemptForExistingEndEntityRequest) returns (CreateEnrollmentAttemptForExistingEndEntityResponse) {
    option (google.api.http) = {
      post: "/v1/enroll-existing"
      body: "*"
    };
  }
  rpc GetEnrollmentAttemptList(GetEnrollmentAttemptListRequest) returns (GetEnrollmentAttemptListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      put: "/v1/enrollment"
      body: "pagination"
      additional_bindings: {get: "/v1/enrollment"}
    };
  }
}
