syntax = "proto3";
package otpki.public.enrollment.v1;

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "otpki/common/api/query/v1/query.proto";
import "otpki/common/enrollment/end_entity/v1/end_entity.proto";

message CreateEndEntityRequest {
  common.enrollment.end_entity.v1.EndEntity end_entity = 1 [(buf.validate.field).required = true];
}

message CreateEndEntityResponse {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetEndEntityRequest {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message GetEndEntityResponse {
  common.enrollment.end_entity.v1.EndEntity end_entity = 1;
}

message GetEndEntityListRequest {
  common.api.query.v1.PaginationRequest pagination = 1;
}

message GetEndEntityListResponse {
  repeated common.enrollment.end_entity.v1.EndEntity data = 1;
  common.api.query.v1.PaginationResponse pagination = 2;
}

message DeleteEndEntityRequest {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message DeleteEndEntityResponse {}

message UpdateEndEntityRequest {
  common.enrollment.end_entity.v1.EndEntity end_entity = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateEndEntityResponse {}
