syntax = "proto3";
package otpki.public.enrollment.v1;

import "google/api/annotations.proto";
import "otpki/public/enrollment/v1/end_entity.proto";
import "otpki/public/enrollment/v1/end_entity_certificate.proto";
import "otpki/public/enrollment/v1/end_entity_profile.proto";
import "otpki/public/enrollment/v1/enroller.proto";

service EnrollmentService {
  // End Entity Profile
  rpc CreateEndEntityProfile(CreateEndEntityProfileRequest) returns (CreateEndEntityProfileResponse) {
    option (google.api.http) = {
      post: "/v1/profiles/end-entity"
      body: "profile"
    };
  }

  rpc GetEndEntityProfile(GetEndEntityProfileRequest) returns (GetEndEntityProfileResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/profiles/end-entity/{id}"};
  }

  rpc UpdateEndEntityProfile(UpdateEndEntityProfileRequest) returns (UpdateEndEntityProfileResponse) {
    option (google.api.http) = {
      put: "/v1/profiles/end-entity/{profile.id}"
      body: "profile"
      additional_bindings: {
        patch: "/v1/profiles/end-entity/{profile.id}"
        body: "profile"
      }
    };
  }

  rpc DeleteEndEntityProfile(DeleteEndEntityProfileRequest) returns (DeleteEndEntityProfileResponse) {
    option (google.api.http) = {delete: "/v1/profiles/end-entity/{id}"};
  }

  rpc GetEndEntityProfileList(GetEndEntityProfileListRequest) returns (GetEndEntityProfileListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      put: "/v1/profiles/end-entity"
      body: "pagination"
      additional_bindings: {get: "/v1/profiles/end-entity"}
    };
  }

  // End Entity
  rpc CreateEndEntity(CreateEndEntityRequest) returns (CreateEndEntityResponse) {
    option (google.api.http) = {
      post: "/v1/end-entities"
      body: "end_entity"
    };
  }

  rpc GetEndEntity(GetEndEntityRequest) returns (GetEndEntityResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/end-entities/{id}"};
  }
  rpc GetEndEntityList(GetEndEntityListRequest) returns (GetEndEntityListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      put: "/v1/end-entities"
      body: "pagination"
      additional_bindings: {get: "/v1/end-entities"}
    };
  }
  rpc DeleteEndEntity(DeleteEndEntityRequest) returns (DeleteEndEntityResponse) {
    option (google.api.http) = {delete: "/v1/end-entities/{id}"};
  }
  rpc UpdateEndEntity(UpdateEndEntityRequest) returns (UpdateEndEntityResponse) {
    option (google.api.http) = {
      put: "/v1/end-entities/{end_entity.id}"
      body: "end_entity"
      additional_bindings: {
        patch: "/v1/end-entities/{end_entity.id}"
        body: "end_entity"
      }
    };
  }

  // Enrollment
  rpc CreateEnrollmentRequest(CreateEnrollmentRequestRequest) returns (CreateEnrollmentRequestResponse) {
    option (google.api.http) = {
      post: "/v1/enrollment"
      body: "enrollment_request"
    };
  }
  rpc CreateEnrollmentRequestForExistingEndEntity(CreateEnrollmentRequestForExistingEndEntityRequest) returns (CreateEnrollmentRequestForExistingEndEntityResponse) {
    option (google.api.http) = {
      post: "/v1/enroll-existing"
      body: "enrollment_request"
    };
  }
  rpc ApproveEnrollmentRequest(ApproveEnrollmentRequestRequest) returns (ApproveEnrollmentRequestResponse) {
    option (google.api.http) = {
      post: "/v1/enrollment/{enrollment_request_id}/approve"
      body: "*"
    };
  }
  rpc RejectEnrollmentRequest(RejectEnrollmentRequestRequest) returns (RejectEnrollmentRequestResponse) {
    option (google.api.http) = {
      post: "/v1/enrollment/{enrollment_request_id}/reject"
      body: "*"
    };
  }
  rpc GetEnrollmentByRequestID(GetEnrollmentByRequestIDRequest) returns (GetEnrollmentByRequestIDResponse) {
    option (google.api.http) = {
      post: "/v1/enrollment/{enrollment_request_id}"
      body: "*"
    };
  }
  rpc RevokeEndEntity(RevokeEndEntityRequest) returns (RevokeEndEntityResponse) {
    option (google.api.http) = {
      post: "/v1/end-entities/{end_entity_id}/revoke"
      body: "*"
    };
  }
  rpc RevokeEndEntityCertificate(RevokeEndEntityCertificateRequest) returns (RevokeEndEntityCertificateResponse) {
    option (google.api.http) = {
      post: "/v1/end-entities/{end_entity_id}/certificate/{issued_certificate_id}/revoke"
      body: "*"
    };
  }
  rpc GetEnrollmentRequestList(GetEnrollmentRequestListRequest) returns (GetEnrollmentRequestListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      put: "/v1/enrollment"
      body: "pagination"
      additional_bindings: {get: "/v1/enrollment"}
    };
  }

  // End Entity Certificate
  rpc GetEndEntityCertificateBySerialNumber(GetEndEntityCertificateBySerialNumberRequest) returns (GetEndEntityCertificateBySerialNumberResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/end-entities/{end_entity_id}/certificate/by-serial-number/{serial_number}"};
  }
  rpc GetEndEntityCertificates(GetEndEntityCertificatesRequest) returns (GetEndEntityCertificatesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/end-entities/{end_entity_id}/certificate"};
  }
  rpc GetEndEntityCertificateList(GetEndEntityCertificateListRequest) returns (GetEndEntityCertificateListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      put: "/v1/end-entities/certificates"
      body: "pagination"
      additional_bindings: {get: "/v1/end-entities/certificates"}
    };
  }
}
