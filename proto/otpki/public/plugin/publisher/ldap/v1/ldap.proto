syntax = "proto3";
package otpki.public.plugin.publisher.ldap.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "otpki/common/core/publisher/v1/publisher.proto";

enum LdapEncryption {
  LDAP_ENCRYPTION_UNSPECIFIED = 0;
  LDAP_ENCRYPTION_NONE = 1;
  LDAP_ENCRYPTION_STARTTLS = 2;
  LDAP_ENCRYPTION_LDAPS = 3;
}

// Connection settings & directory publishing policy
message LdapConfig {
  // Tried in order on fail
  repeated string hostnames = 1 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      string: {min_len: 1}
    }
  }];
  int64 port = 2 [(buf.validate.field).int64 = {
    gte: 1
    lte: 65535
  }];
  LdapEncryption encryption = 3;
  bool tls_insecure = 4;
  string bind_dn = 5 [(buf.validate.field).string.min_len = 1];
  string password = 6;
  google.protobuf.Duration connection_timeout = 7; // 10s
  google.protobuf.Duration read_timeout = 8; // 30s searches
  google.protobuf.Duration write_timeout = 9; // 60s

  bool create_missing_entries = 10; // Opt in to entry creation on publish
  bool skip_existing_entries = 11; // Opt in to creat only, skip existing
  bool add_non_existing_attributes = 12; // Opt in to copy missing attributes onto existing
  bool modify_existing_attributes = 13; // Opt in to overwrite attributes already on existing
  bool add_multiple_certificates = 14; // Opt in to append certificates instead of replacing
  bool remove_revoked_certificates = 15; // Opt in to delete certificate on revocation
  bool remove_revoked_entries = 16; // Opt in to delete entry on revocation

  repeated string user_object_classes = 17; // top, person, organizationalPerson, inetOrgPerson, pkiUser
  repeated string ca_object_classes = 18; // top, applicationProcess, pkiCA
  repeated string crl_object_classes = 19; // top, cRLDistributionPoint

  string user_certificate_attribute = 20; // userCertificate;binary
  string ca_certificate_attribute = 21; // cACertificate;binary
  string crl_attribute = 22; // certificateRevocationList;binary
  string delta_crl_attribute = 23; // deltaRevocationList;binary
  string arl_attribute = 24; // Non delta crls publish here when set
}

// LDAP specific cert-publishing trigger config
message LdapCertTriggerConfig {
  oneof target {
    option (buf.validate.oneof).required = true;
    string ca_id = 1 [
      (buf.validate.field).string.uuid = true,
      (otpki.common.core.publisher.v1.lookup) = PUBLISHER_LOOKUP_CERTIFICATE_AUTHORITY
    ];
    string certificate_profile_id = 2 [
      (buf.validate.field).string.uuid = true,
      (otpki.common.core.publisher.v1.lookup) = PUBLISHER_LOOKUP_CERTIFICATE_PROFILE
    ];
  }
  string certificate_dn_template = 3 [(buf.validate.field).string.min_len = 1];
  string ca_dn_template = 4; // Renders ca certs, cert template fallback
}

// LDAP specific crl-publishing trigger config
message LdapCrlTriggerConfig {
  string ca_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true,
    (otpki.common.core.publisher.v1.lookup) = PUBLISHER_LOOKUP_CERTIFICATE_AUTHORITY
  ];
  string crl_dn_template = 2 [(buf.validate.field).string.min_len = 1];
}
