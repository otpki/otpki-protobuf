syntax = "proto3";
package otpki.public.plugin.publisher.smtp.v1;

import "buf/validate/validate.proto";
import "otpki/common/core/publisher/v1/publisher.proto";

enum SmtpEncryption {
  SMTP_ENCRYPTION_UNSPECIFIED = 0;
  SMTP_ENCRYPTION_NONE = 1;
  SMTP_ENCRYPTION_STARTTLS = 2;
  SMTP_ENCRYPTION_SSL = 3;
}

// Connection settings shared by every trigger that delivers by email
message SmtpConfig {
  string from_address = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.email = true
  ];
  string from_name = 2;
  string host = 3 [(buf.validate.field).string.min_len = 1];
  string port = 4 [(buf.validate.field).string.min_len = 1];
  string username = 5;
  string password = 6;
  SmtpEncryption encryption = 7;
  bool tls_insecure = 8;
}

// Per-trigger config for an SMTP cert
message SmtpCertTriggerConfig {
  oneof target {
    option (buf.validate.oneof).required = true;
    string ca_id = 1 [
      (buf.validate.field).string.uuid = true,
      (otpki.common.core.publisher.v1.lookup) = PUBLISHER_LOOKUP_CERTIFICATE_AUTHORITY
    ];
    string certificate_profile_id = 2 [
      (buf.validate.field).string.uuid = true,
      (otpki.common.core.publisher.v1.lookup) = PUBLISHER_LOOKUP_CERTIFICATE_PROFILE
    ];
  }
  // Recipients the published certificate is emailed to
  repeated string recipients = 3 [(buf.validate.field).repeated = {
    min_items: 1
    items: {string: {email: true}}
  }];
  string subject = 4;
}

// Per-trigger config for an SMTP CRL
message SmtpCrlTriggerConfig {
  string ca_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true,
    (otpki.common.core.publisher.v1.lookup) = PUBLISHER_LOOKUP_CERTIFICATE_AUTHORITY
  ];
  // Recipients the published CRL is emailed to
  repeated string recipients = 2 [(buf.validate.field).repeated = {
    min_items: 1
    items: {string: {email: true}}
  }];
  string subject = 3;
}

// Targets the end entity that had its credentials delivered
message SmtpCredentialsTriggerConfig {
  oneof target {
    option (buf.validate.oneof).required = true;
    string end_entity_profile_id = 1 [
      (buf.validate.field).string.uuid = true,
      (otpki.common.core.publisher.v1.lookup) = PUBLISHER_LOOKUP_END_ENTITY_PROFILE
    ];
    string end_entity_id = 2 [
      (buf.validate.field).string.uuid = true,
      (otpki.common.core.publisher.v1.lookup) = PUBLISHER_LOOKUP_END_ENTITY
    ];
  }
}
