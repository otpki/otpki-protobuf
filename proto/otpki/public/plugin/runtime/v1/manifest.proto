syntax = "proto3";
package otpki.public.plugin.runtime.v1;

import "otpki/common/auth/v1/auth.proto";

message RouteSpec {
  enum Protocol {
    PROTOCOL_UNSPECIFIED = 0;
    PROTOCOL_HTTP = 1;
    PROTOCOL_TCP = 2;
    PROTOCOL_UDP = 3;
  }

  Protocol protocol = 1;
  string address = 2; // location of listener on plugin side (0.0.0.0:<port>)
  string path_prefix = 3;
  uint32 gateway_port = 4; // only needed for UDP/TCP
}

message Migration {
  string migration_schema = 1;
  map<string, bytes> files = 2; // map of file name to file contents
}

message FrontendSidebarItem {
  string title = 1;
  string path = 2;
}

message FrontendSidebarSpec {
  string title = 1;
  string parent_group = 2;
  repeated FrontendSidebarItem items = 3;
}

message FrontendPageHeader {
  string title = 1;
  string path = 2;
}

message CustomResource {
  string display_name = 1;
  repeated common.auth.v1.Action allowed_actions = 2;
  bool allows_object_id = 3;
}

message Manifest {
  string name = 1;
  repeated Migration migrations = 2;
  repeated RouteSpec routes = 3;
  repeated FrontendPageHeader headers = 4;
  FrontendSidebarSpec sidebar = 5;
  string ui_path_prefix = 6;

  // since auth resource/action enums are simply just int32
  // we can technically store arbitrary numbers in place of the permissions
  // we just need a mapping for the UI to be able to take the unknown number and
  // convert it to a human readable string. These should be maps from plugin-defined
  // constants to human-readable resources.
  map<int32, CustomResource> custom_resource_definitions = 7;
}

message GetFrontendManifestsRequest {}

message GetFrontendManifestsResponse {
  // this should be everything except migrations and route specs
  repeated Manifest manifests = 1;
}

service ManifestService {
  rpc GetFrontendManifests(GetFrontendManifestsRequest) returns (GetFrontendManifestsResponse);
}
