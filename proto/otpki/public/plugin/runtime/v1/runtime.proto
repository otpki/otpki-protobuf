syntax = "proto3";
package otpki.public.plugin.runtime.v1;

import "buf/validate/validate.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "otpki/common/api/v1/native_type.proto";
import "otpki/common/core/certificate_authority/v1/certificate_authority.proto";
import "otpki/common/core/certificate_profile/v1/certificate_profile.proto";
import "otpki/common/core/end_entity/v1/end_entity.proto";
import "otpki/common/core/end_entity_certificate/v1/end_entity_certificate.proto";
import "otpki/common/core/enroller/v1/enroller.proto";
import "otpki/common/core/issuer/v1/issuer.proto";
import "otpki/common/core/key/v1/key.proto";
import "otpki/common/x509/v1/x509.proto";

message GetConfigRequest {}

message GetConfigResponse {
  bytes config_json = 1;
}

message CreateNonceRequest {}

message CreateNonceResponse {
  string nonce = 1;
}

message AddNonceRequest {
  string nonce = 1 [(buf.validate.field).required = true];
}

message AddNonceResponse {
  string nonce = 1;
}

message CheckNonceRequest {
  string nonce = 1 [(buf.validate.field).required = true];
}

message CheckNonceResponse {
  bool is_valid = 1;
}

message AddUniqueNonceRequest {
  string nonce = 1 [(buf.validate.field).required = true];
}

message AddUniqueNonceResponse {
  bool is_unique = 1;
}

message GetEndEntityByLoginIDRequest {
  string login_id = 1 [(buf.validate.field).required = true];
}

message GetEndEntityByLoginIDResponse {
  common.core.end_entity.v1.EndEntity end_entity = 1;
}

message GetEndEntityRequest {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message GetEndEntityResponse {
  common.core.end_entity.v1.EndEntity end_entity = 1;
}

message UpdateEndEntityRequest {
  common.core.end_entity.v1.EndEntity end_entity = 1 [(buf.validate.field).required = true];
  google.protobuf.FieldMask update_mask = 2 [(buf.validate.field).required = true];
}

message UpdateEndEntityResponse {}

message GetKeyRequest {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message GetKeyResponse {
  common.core.key.v1.Key key = 1;
  bytes public_key_der = 2;
}

message GetAllRootCertificateAuthorityCertificatesRequest {}

message GetAllRootCertificateAuthorityCertificatesResponse {
  repeated bytes certificates_der = 1;
}

message GetLatestCertificateAuthorityCertificateRequest {
  string ca_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message GetLatestCertificateAuthorityCertificateResponse {
  common.core.certificate_authority.v1.CertificateAuthorityCertificate certificate_authority_certificate = 1;
}

message GetCertificateAuthorityRequest {
  string ca_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message GetCertificateAuthorityResponse {
  common.core.certificate_authority.v1.CertificateAuthority certificate_authority = 1;
}

message GetCertificateProfileRequest {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message GetCertificateProfileResponse {
  common.core.certificate_profile.v1.CertificateProfile certificate_profile = 1;
}

message CreateEnrollmentAttemptRequest {
  common.core.enroller.v1.EnrollmentAttempt enrollment_attempt = 1 [(buf.validate.field).required = true];
  common.core.end_entity.v1.EndEntity end_entity = 2;
  bool skip_verification = 3;
  bool allow_existing = 4;
  bool require_existing = 5;
  bool check_password = 6;
  bool auto_reset_generated_end_entity = 7;
  bool require_immediate_issuance = 8;
}

message CreateEnrollmentAttemptResponse {
  common.core.enroller.v1.EnrollmentResponse enrollment_response = 1;
}

message RevokeEndEntityCertificateRequest {
  string end_entity_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
  string issued_certificate_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
  common.x509.v1.RevocationReasonCode revocation_reason_code = 3 [(buf.validate.field).required = true];
}

message RevokeEndEntityCertificateResponse {}

message GetEndEntityCertificateBySerialNumberRequest {
  bytes serial_number = 1 [
    (common.api.v1.go_native_type) = "*big.Int",
    (common.api.v1.go_native_import_path) = "math/big",
    (buf.validate.field).required = true
  ];
}

message GetEndEntityCertificateBySerialNumberResponse {
  common.core.end_entity_certificate.v1.EndEntityCertificate end_entity_certificate = 1;
}

message GetEndEntityCertificatesRequest {
  string end_entity_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message GetEndEntityCertificatesResponse {
  repeated common.core.end_entity_certificate.v1.EndEntityCertificate end_entity_certificates = 1;
}

message GetIssuanceByRequestIDRequest {
  string issuance_request_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message GetIssuanceByRequestIDResponse {
  common.core.issuer.v1.IssuanceResponse issuance_response = 1;
}

message IssuedCertificateStatusSnapshot {
  string certificate_id = 1;
  google.protobuf.Timestamp status_updated_at = 2;

  bytes certificate_der = 10;
  repeated bytes certificate_chain_der = 11;
  bytes serial_number = 12 [
    (common.api.v1.go_native_type) = "*big.Int",
    (common.api.v1.go_native_import_path) = "math/big"
  ];
  google.protobuf.Timestamp not_before = 13;
  google.protobuf.Timestamp not_after = 14;

  string issuing_certificate_authority_id = 20;
  string issuer_certificate_id = 21;
  bytes issuer_certificate_der = 22;

  google.protobuf.Timestamp revoked_at = 30;
  optional int32 revocation_reason_code = 31;
  bool in_crl = 32;

  int32 protocol_used = 40;
  string certificate_profile_id = 41;
  string issuance_request_id = 42;
}

message ListIssuedCertificateStatusSnapshotsRequest {
  google.protobuf.Timestamp after_updated_at = 1;
  string after_certificate_id = 2;
  int32 limit = 3;

  // Optional host-side scope. Empty means all certificate authorities.
  repeated string certificate_authority_ids = 4;
}

message ListIssuedCertificateStatusSnapshotsResponse {
  repeated IssuedCertificateStatusSnapshot snapshots = 1;
}

message CertificateStatusCertID {
  common.x509.v1.HashAlgorithm hash_algorithm = 1;
  bytes issuer_name_hash = 2;
  bytes issuer_key_hash = 3;
  bytes serial_number = 4 [
    (common.api.v1.go_native_type) = "*big.Int",
    (common.api.v1.go_native_import_path) = "math/big"
  ];
}

message GetIssuedCertificateStatusSnapshotByCertIDRequest {
  CertificateStatusCertID cert_id = 1 [(buf.validate.field).required = true];
}

message GetIssuedCertificateStatusSnapshotByCertIDResponse {
  IssuedCertificateStatusSnapshot snapshot = 1;
}

// The optional Any payload should contain one of the public key option messages from
// otpki.common.core.key.v1 when the underlying key type requires it.
message SignKeyRequest {
  string key_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
  bytes digest = 2 [(buf.validate.field).required = true];
  google.protobuf.Any opts = 3;
}

message SignKeyResponse {
  bytes signature = 1;
}

// The optional Any payload should contain one of the public key option messages from
// otpki.common.core.key.v1 when the underlying key type requires it.
message DecryptKeyRequest {
  string key_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
  bytes ciphertext = 2 [(buf.validate.field).required = true];
  google.protobuf.Any opts = 3;
}

message DecryptKeyResponse {
  bytes plaintext = 1;
}

message EncryptWithEnvironmentTokenRequest {
  bytes data = 1 [(buf.validate.field).required = true];
}

message EncryptWithEnvironmentTokenResponse {
  bytes encrypted_data = 1;
}

message DecryptWithEnvironmentTokenRequest {
  bytes encrypted_data = 1 [(buf.validate.field).required = true];
}

message DecryptWithEnvironmentTokenResponse {
  bytes plaintext = 1;
}

message HeaderValues {
  repeated string values = 1;
}

message AuthenticateRequest {
  map<string, HeaderValues> headers = 1;
}

message AuthenticateResponse {
  bytes principal = 1;
}

service PluginRuntimeService {
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc CreateNonce(CreateNonceRequest) returns (CreateNonceResponse);
  rpc AddNonce(AddNonceRequest) returns (AddNonceResponse);
  rpc CheckNonce(CheckNonceRequest) returns (CheckNonceResponse);
  rpc AddUniqueNonce(AddUniqueNonceRequest) returns (AddUniqueNonceResponse);
  rpc GetEndEntityByLoginID(GetEndEntityByLoginIDRequest) returns (GetEndEntityByLoginIDResponse);
  rpc GetEndEntity(GetEndEntityRequest) returns (GetEndEntityResponse);
  rpc UpdateEndEntity(UpdateEndEntityRequest) returns (UpdateEndEntityResponse);
  rpc GetKey(GetKeyRequest) returns (GetKeyResponse);
  rpc GetAllRootCertificateAuthorityCertificates(GetAllRootCertificateAuthorityCertificatesRequest) returns (GetAllRootCertificateAuthorityCertificatesResponse);
  rpc GetLatestCertificateAuthorityCertificate(GetLatestCertificateAuthorityCertificateRequest) returns (GetLatestCertificateAuthorityCertificateResponse);
  rpc GetCertificateAuthority(GetCertificateAuthorityRequest) returns (GetCertificateAuthorityResponse);
  rpc GetCertificateProfile(GetCertificateProfileRequest) returns (GetCertificateProfileResponse);
  rpc CreateEnrollmentAttempt(CreateEnrollmentAttemptRequest) returns (CreateEnrollmentAttemptResponse);
  rpc RevokeEndEntityCertificate(RevokeEndEntityCertificateRequest) returns (RevokeEndEntityCertificateResponse);
  rpc GetEndEntityCertificateBySerialNumber(GetEndEntityCertificateBySerialNumberRequest) returns (GetEndEntityCertificateBySerialNumberResponse);
  rpc GetEndEntityCertificates(GetEndEntityCertificatesRequest) returns (GetEndEntityCertificatesResponse);
  rpc GetIssuanceByRequestID(GetIssuanceByRequestIDRequest) returns (GetIssuanceByRequestIDResponse);
  rpc ListIssuedCertificateStatusSnapshots(ListIssuedCertificateStatusSnapshotsRequest) returns (ListIssuedCertificateStatusSnapshotsResponse);
  rpc GetIssuedCertificateStatusSnapshotByCertID(GetIssuedCertificateStatusSnapshotByCertIDRequest) returns (GetIssuedCertificateStatusSnapshotByCertIDResponse);
  rpc SignKey(SignKeyRequest) returns (SignKeyResponse);
  rpc DecryptKey(DecryptKeyRequest) returns (DecryptKeyResponse);
  rpc EncryptWithEnvironmentToken(EncryptWithEnvironmentTokenRequest) returns (EncryptWithEnvironmentTokenResponse);
  rpc DecryptWithEnvironmentToken(DecryptWithEnvironmentTokenRequest) returns (DecryptWithEnvironmentTokenResponse);
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
}
