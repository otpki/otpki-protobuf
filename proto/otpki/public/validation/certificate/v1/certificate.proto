syntax = "proto3";
package otpki.public.validation.certificate.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/httpbody.proto";
import "otpki/common/api/v1/auth_required.proto";

message GetCertificateRequest {
  string certificate_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

service CertificateService {
  // This route is also used for the IssuerUrl on the AIA of issued certificates
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc GetCertificate(GetCertificateRequest) returns (google.api.HttpBody) {
    option (common.api.v1.auth_required) = false;
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/validation/certificates/{certificate_id}/certificate.cer"};
  }
}
