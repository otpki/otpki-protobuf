syntax = "proto3";
package otpki.public.validation.v1;

import "buf/validate/validate.proto";
import "otpki/common/x509/v1/revocation_list.proto";

message GetLatestRevocationListRequest {
  string ca_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetLatestRevocationListResponse {
  common.x509.v1.RevocationList revocation_list = 1;
}

message GetRevocationListRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetRevocationListResponse {
  common.x509.v1.RevocationList revocation_list = 1;
}

message CRLDistributionPointRequest {
  string fingerprint = 1;
}
