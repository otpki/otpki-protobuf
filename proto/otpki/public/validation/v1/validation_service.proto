syntax = "proto3";
package otpki.public.validation.v1;

import "google/api/annotations.proto";
import "google/api/httpbody.proto";
import "otpki/common/api/v1/httpbody.proto";
import "otpki/public/validation/v1/revocation_list.proto";

service ValidationService {
  // CRL

  rpc GetLatestRevocationList(GetLatestRevocationListRequest) returns (GetLatestRevocationListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/certificate-authorities/{ca_id}/revocation-list"};
  }

  rpc GetRevocationList(GetRevocationListRequest) returns (GetRevocationListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/revocation-lists/{id}"};
  }

  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc CRLDistributionPoint(CRLDistributionPointRequest) returns (google.api.HttpBody) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/certificate-authorities/by-fingerprint/{fingerprint}/latest.crl"};
  }

  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc OCSPResponder(common.api.v1.HttpRequestBody) returns (google.api.HttpBody) {
    option (google.api.http) = {
      get: "/v1/ocsp/{data}"
      additional_bindings: {
        post: "/v1/ocsp"
        body: "*"
      }
    };
  }
}
