syntax = "proto3";
package otpki.public.validation.revocation_list.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/httpbody.proto";
import "otpki/common/api/v1/httpbody.proto";
import "otpki/common/x509/v1/revocation_list.proto";

message GetLatestRevocationListRequest {
  string ca_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetLatestRevocationListResponse {
  common.x509.v1.RevocationList revocation_list = 1;
}

message GetRevocationListRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetRevocationListResponse {
  common.x509.v1.RevocationList revocation_list = 1;
}

message CRLDistributionPointRequest {
  string fingerprint = 1;
}

service RevocationListService {
  rpc GetLatestRevocationList(GetLatestRevocationListRequest) returns (GetLatestRevocationListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/certificate-authorities/validation/{ca_id}/revocation-list"};
  }

  rpc GetRevocationList(GetRevocationListRequest) returns (GetRevocationListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/revocation-lists/{id}"};
  }

  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc CRLDistributionPoint(CRLDistributionPointRequest) returns (google.api.HttpBody) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/certificate-authorities/validation/by-fingerprint/{fingerprint}/latest.crl"};
  }

  //  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  //  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  //  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  //  rpc OCSPResponder(common.api.v1.HttpRequestBody) returns (google.api.HttpBody) {
  //    option (google.api.http) = {
  //      get: "/v1/ocsp/{data}"
  //      additional_bindings: {
  //        post: "/v1/ocsp"
  //        body: "*"
  //      }
  //    };
  //  }
}
