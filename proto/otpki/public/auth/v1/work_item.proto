syntax = "proto3";
package otpki.public.auth.v1;

import "buf/validate/validate.proto";
import "otpki/common/api/query/v1/query.proto";
import "otpki/common/auth/v1/auth.proto";

message GetWorkItemRequest {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message GetWorkItemResponse {
  common.auth.v1.WorkItem work_item = 1;
}

message GetWorkItemListRequest {
  common.api.query.v1.PaginationRequest pagination = 1;
}

message GetWorkItemListResponse {
  repeated common.auth.v1.WorkItem data = 1;
  common.api.query.v1.PaginationResponse pagination = 2;
}

message ApproveWorkItemRequest {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message ApproveWorkItemResponse {}

message RejectWorkItemRequest {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message RejectWorkItemResponse {}

message IsCurrentUserValidApproverRequest {
  string approval_profile_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message IsCurrentUserValidApproverResponse {
  bool is_valid = 1;
}
