syntax = "proto3";
package otpki.public.auth.role.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "otpki/common/api/query/v1/query.proto";
import "otpki/common/auth/v1/auth.proto";

message CreateRoleRequest {
  common.auth.v1.Role role = 1 [(buf.validate.field).required = true];
}

message CreateRoleResponse {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetRoleRequest {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message GetRoleResponse {
  common.auth.v1.Role role = 1;
}

message GetManyRolesRequest {
  repeated string ids = 1 [(buf.validate.field).repeated = {
    unique: true
    items: {string: {uuid: true}}
  }];
}

message GetManyRolesResponse {
  repeated common.auth.v1.Role roles = 1;
}

message GetManyRolesByNamesRequest {
  repeated string names = 1 [
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.string.min_len = 1
  ];
}

message GetManyRolesByNamesResponse {
  repeated common.auth.v1.Role roles = 1;
}

message CreateOrGetManyRolesByNamesRequest {
  repeated string names = 1 [
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.string.min_len = 1
  ];
}

message CreateOrGetManyRolesByNamesResponse {
  repeated common.auth.v1.Role roles = 1;
}

message UpdateRoleRequest {
  common.auth.v1.Role role = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateRoleResponse {}

message DeleteRoleRequest {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message DeleteRoleResponse {}

message GetRoleListRequest {
  common.api.query.v1.PaginationRequest pagination = 1;
}

message GetRoleListResponse {
  repeated common.auth.v1.Role data = 1;
  common.api.query.v1.PaginationResponse pagination = 2;
}

message SetRolePermissionsRequest {
  repeated common.auth.v1.Permission permissions = 1;
  string role_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message SetRolePermissionsResponse {}

message GetRolePermissionsRequest {
  string role_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message GetRolePermissionsResponse {
  repeated common.auth.v1.Permission permissions = 1;
}

service RoleService {
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse) {
    option (google.api.http) = {
      post: "/v1/auth/roles"
      body: "role"
    };
  }
  rpc GetRole(GetRoleRequest) returns (GetRoleResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/auth/roles/{id}"};
  }
  rpc GetManyRoles(GetManyRolesRequest) returns (GetManyRolesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      put: "/v1/auth/roles/by-ids"
      body: "*"
    };
  }
  rpc GetManyRolesByNames(GetManyRolesByNamesRequest) returns (GetManyRolesByNamesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      put: "/v1/auth/roles/by-names"
      body: "*"
    };
  }
  rpc CreateOrGetManyRolesByNames(CreateOrGetManyRolesByNamesRequest) returns (CreateOrGetManyRolesByNamesResponse) {
    option (google.api.http) = {
      post: "/v1/auth/roles/by-names"
      body: "*"
    };
  }
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse) {
    option (google.api.http) = {
      put: "/v1/auth/roles/{role.id}"
      body: "role"
      additional_bindings: {
        patch: "/v1/auth/roles/{role.id}"
        body: "role"
      }
    };
  }
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse) {
    option (google.api.http) = {delete: "/v1/auth/roles/{id}"};
  }
  rpc GetRoleList(GetRoleListRequest) returns (GetRoleListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      put: "/v1/auth/roles"
      body: "pagination"
      additional_bindings: {get: "/v1/auth/roles"}
    };
  }
  rpc SetRolePermissions(SetRolePermissionsRequest) returns (SetRolePermissionsResponse) {
    option (google.api.http) = {
      post: "/v1/auth/roles/{role_id}/permissions"
      body: "permissions"
    };
  }
  rpc GetRolePermissions(GetRolePermissionsRequest) returns (GetRolePermissionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/auth/roles/{role_id}/permissions"};
  }
}
