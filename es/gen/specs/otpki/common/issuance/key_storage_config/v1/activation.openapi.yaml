openapi: 3.1.0
info:
  title: otpki.common.issuance.key_storage_config.v1
paths: {}
components:
  schemas:
    google.protobuf.Duration:
      type: string
      format: duration
      description: |-
        A Duration represents a signed, fixed-length span of time represented
         as a count of seconds and fractions of seconds at nanosecond
         resolution. It is independent of any calendar and concepts like "day"
         or "month". It is related to Timestamp in that the difference between
         two Timestamp values is a Duration and it can be added or subtracted
         from a Timestamp. Range is approximately +-10,000 years.

         # Examples

         Example 1: Compute Duration from two Timestamps in pseudo code.

             Timestamp start = ...;
             Timestamp end = ...;
             Duration duration = ...;

             duration.seconds = end.seconds - start.seconds;
             duration.nanos = end.nanos - start.nanos;

             if (duration.seconds < 0 && duration.nanos > 0) {
               duration.seconds += 1;
               duration.nanos -= 1000000000;
             } else if (duration.seconds > 0 && duration.nanos < 0) {
               duration.seconds -= 1;
               duration.nanos += 1000000000;
             }

         Example 2: Compute Timestamp from Timestamp + Duration in pseudo code.

             Timestamp start = ...;
             Duration duration = ...;
             Timestamp end = ...;

             end.seconds = start.seconds + duration.seconds;
             end.nanos = start.nanos + duration.nanos;

             if (end.nanos < 0) {
               end.seconds -= 1;
               end.nanos += 1000000000;
             } else if (end.nanos >= 1000000000) {
               end.seconds += 1;
               end.nanos -= 1000000000;
             }

         Example 3: Compute Duration from datetime.timedelta in Python.

             td = datetime.timedelta(days=3, minutes=10)
             duration = Duration()
             duration.FromTimedelta(td)

         # JSON Mapping

         In JSON format, the Duration type is encoded as a string rather than an
         object, where the string ends in the suffix "s" (indicating seconds) and
         is preceded by the number of seconds, with nanoseconds expressed as
         fractional seconds. For example, 3 seconds with 0 nanoseconds should be
         encoded in JSON format as "3s", while 3 seconds and 1 nanosecond should
         be expressed in JSON format as "3.000000001s", and 3 seconds and 1
         microsecond should be expressed in JSON format as "3.000001s".
    otpki.common.issuance.key_storage_config.v1.Activation:
      type: object
      properties:
        keyStorageConfigId:
          type: string
          title: key_storage_config_id
          format: uuid
          description: |-
            the key storage config for which to apply this
             activation. the key storage config will control
             whether or not this is persisted via auto-activation
        useAutoActivation:
          type: boolean
          title: use_auto_activation
          description: |-
            when this is checked, it will ignore all the other fields
             and just use the stored auto activation code if it exists
        activationCode:
          type: string
          title: activation_code
          description: this is the provided pin
        secretShares:
          type: array
          items:
            type: string
            minLength: 2
          title: secret_shares
          uniqueItems: true
          description: |-
            if the pin is an empty string, attempt to
             construct the pin from secret shares. note: these should be hex strings
             and can be formatted any which way (i.e. 0xDEADBEEF, DEADBEEF, DE AD BE EF, 0Xdeadbeef, etc.)
        activationDuration:
          title: activation_duration
          description: |-
            if activation duration is set, this will a) prevent code from being stored for auto activation
             and b) restrict the activation code from being used after this period of time
             if it is unset and the key storage config does not have auto activation, this activation will
             persist for the lifetime of the activation state store (either in mem or valkey backed)
          $ref: '#/components/schemas/google.protobuf.Duration'
      title: Activation
      additionalProperties: false
security: []
