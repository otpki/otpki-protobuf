          title: serial_number
          format: byte
        displayName:
          type: string
          title: display_name
        subjectDn:
          type: array
          items:
            $ref: '#/components/schemas/otpki.common.x509.v1.SubjectDNAttribute'
          title: subject_dn
        issuerDn:
          type: array
          items:
            $ref: '#/components/schemas/otpki.common.x509.v1.SubjectDNAttribute'
          title: issuer_dn
        notBefore:
          title: not_before
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        notAfter:
          title: not_after
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        revokedAt:
          oneOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
            - type: "null"
          title: revoked_at
        revocationReasonCode:
          oneOf:
            - $ref: '#/components/schemas/otpki.common.x509.v1.RevocationReasonCode'
            - type: "null"
          title: revocation_reason_code
        inCrl:
          type: boolean
          title: in_crl
        issuedByCaCertificateId:
          type:
            - string
            - "null"
          title: issued_by_ca_certificate_id
          format: uuid
        issuedFromCertificateProfileId:
          type: string
          title: issued_from_certificate_profile_id
          format: uuid
        issuedFromIssuanceRequestId:
          type: string
          title: issued_from_issuance_request_id
          format: uuid
        protocolUsed:
          title: protocol_used
          $ref: '#/components/schemas/otpki.common.issuance.issuer.v1.IssuingProtocol'
        createdAt:
          title: created_at
          description: not settable on creation
          readOnly: true
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          description: not settable on creation
          readOnly: true
          $ref: '#/components/schemas/google.protobuf.Timestamp'
