  schemas:
    google.protobuf.Duration:
      type: string
      format: duration
      description: |-
        A Duration represents a signed, fixed-length span of time represented
         as a count of seconds and fractions of seconds at nanosecond
         resolution. It is independent of any calendar and concepts like "day"
         or "month". It is related to Timestamp in that the difference between
         two Timestamp values is a Duration and it can be added or subtracted
         from a Timestamp. Range is approximately +-10,000 years.

         # Examples

         Example 1: Compute Duration from two Timestamps in pseudo code.

             Timestamp start = ...;
             Timestamp end = ...;
             Duration duration = ...;

             duration.seconds = end.seconds - start.seconds;
             duration.nanos = end.nanos - start.nanos;

             if (duration.seconds < 0 && duration.nanos > 0) {
               duration.seconds += 1;
               duration.nanos -= 1000000000;
             } else if (duration.seconds > 0 && duration.nanos < 0) {
               duration.seconds -= 1;
               duration.nanos += 1000000000;
             }

         Example 2: Compute Timestamp from Timestamp + Duration in pseudo code.

             Timestamp start = ...;
             Duration duration = ...;
             Timestamp end = ...;

             end.seconds = start.seconds + duration.seconds;
             end.nanos = start.nanos + duration.nanos;

             if (end.nanos < 0) {
               end.seconds -= 1;
               end.nanos += 1000000000;
             } else if (end.nanos >= 1000000000) {
               end.seconds += 1;
               end.nanos -= 1000000000;
             }

         Example 3: Compute Duration from datetime.timedelta in Python.

             td = datetime.timedelta(days=3, minutes=10)
             duration = Duration()
             duration.FromTimedelta(td)

         # JSON Mapping

         In JSON format, the Duration type is encoded as a string rather than an
         object, where the string ends in the suffix "s" (indicating seconds) and
         is preceded by the number of seconds, with nanoseconds expressed as
         fractional seconds. For example, 3 seconds with 0 nanoseconds should be
         encoded in JSON format as "3s", while 3 seconds and 1 nanosecond should
         be expressed in JSON format as "3.000000001s", and 3 seconds and 1
         microsecond should be expressed in JSON format as "3.000001s".
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: |-
        A Timestamp represents a point in time independent of any time zone or local
         calendar, encoded as a count of seconds and fractions of seconds at
         nanosecond resolution. The count is relative to an epoch at UTC midnight on
         January 1, 1970, in the proleptic Gregorian calendar which extends the
         Gregorian calendar backwards to year one.

         All minutes are 60 seconds long. Leap seconds are "smeared" so that no leap
         second table is needed for interpretation, using a [24-hour linear
         smear](https://developers.google.com/time/smear).

         The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By
         restricting to that range, we ensure that we can convert to and from [RFC
         3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.

         # Examples

         Example 1: Compute Timestamp from POSIX `time()`.

             Timestamp timestamp;
             timestamp.set_seconds(time(NULL));
             timestamp.set_nanos(0);

         Example 2: Compute Timestamp from POSIX `gettimeofday()`.

             struct timeval tv;
             gettimeofday(&tv, NULL);

             Timestamp timestamp;
             timestamp.set_seconds(tv.tv_sec);
             timestamp.set_nanos(tv.tv_usec * 1000);

         Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.

             FILETIME ft;
             GetSystemTimeAsFileTime(&ft);
             UINT64 ticks = (((UINT64)ft.dwHighDateTime) << 32) | ft.dwLowDateTime;

             // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z
             // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.
             Timestamp timestamp;
             timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));
             timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));

         Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.

             long millis = System.currentTimeMillis();

             Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)
                 .setNanos((int) ((millis % 1000) * 1000000)).build();

         Example 5: Compute Timestamp from Java `Instant.now()`.

             Instant now = Instant.now();

             Timestamp timestamp =
                 Timestamp.newBuilder().setSeconds(now.getEpochSecond())
                     .setNanos(now.getNano()).build();

         Example 6: Compute Timestamp from current time in Python.

             timestamp = Timestamp()
             timestamp.GetCurrentTime()

         # JSON Mapping

         In JSON format, the Timestamp type is encoded as a string in the
         [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the
         format is "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z"
         where {year} is always expressed using four digits while {month}, {day},
         {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional
         seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),
         are optional. The "Z" suffix indicates the timezone ("UTC"); the timezone
         is required. A proto3 JSON serializer should always use UTC (as indicated by
         "Z") when printing the Timestamp type and a proto3 JSON parser should be
         able to accept both UTC and other timezones (as indicated by an offset).

         For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
         01:30 UTC on January 15, 2017.

         In JavaScript, one can convert a Date object to this format using the
         standard
         [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
         method. In Python, a standard `datetime.datetime` object can be converted
         to this format using
         [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
         the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
         the Joda Time's [`ISODateTimeFormat.dateTime()`](
         http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
         ) to obtain a formatter capable of generating timestamps in this format.
    otpki.common.issuance.certificate_profile.v1.CertificateProfile:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
          description: not settable on creation
          readOnly: true
        name:
          type: string
          title: name
          maxLength: 64
          minLength: 3
        description:
          type: string
          title: description
        kind:
          not:
            enum:
              - CERTIFICATE_PROFILE_KIND_UNSPECIFIED
          title: kind
          $ref: '#/components/schemas/otpki.common.issuance.certificate_profile.v1.CertificateProfileKind'
        createdAt:
          title: created_at
          description: |-
            db details
             not settable on creation
          readOnly: true
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          description: not settable on creation
          readOnly: true
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        availableKeyTypes:
          type: array
          items:
            $ref: '#/components/schemas/otpki.common.issuance.key.v1.KeyType'
          title: available_key_types
          uniqueItems: true
          description: signature algo/keys
        signatureAlgorithm:
          title: signature_algorithm
          description: UNSPECIFIED == inherit from CA
          $ref: '#/components/schemas/otpki.common.x509.v1.SignatureAlgorithm'
        availableAlternativeKeyTypes:
          type: array
          items:
            $ref: '#/components/schemas/otpki.common.issuance.key.v1.KeyType'
          title: available_alternative_key_types
          uniqueItems: true
        alternativeSignatureAlgorithm:
          title: alternative_signature_algorithm
          description: 'TODO: alt sig algo not enforced (dependent on go fork) when len(alt key types) == 0, alt sig algo is ignored, no alt sig, UNSPECIFIED == inherit from CA'
          $ref: '#/components/schemas/otpki.common.x509.v1.SignatureAlgorithm'
        validityDuration:
          title: validity_duration
          description: validity
          $ref: '#/components/schemas/google.protobuf.Duration'
        validityEndDate:
          title: validity_end_date
          description: if both end date and duration are specified, shortest is what is issued
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        validityOffset:
          title: validity_offset
          description: default should be 10 min if unset, during fixed date, only notBefore is offset
          $ref: '#/components/schemas/google.protobuf.Duration'
        forbiddenExpirationDays:
          type: array
          items:
            $ref: '#/components/schemas/otpki.common.x509.v1.DayOfWeek'
          title: forbidden_expiration_days
          uniqueItems: true
          description: Days on which certificates should not expire
        expirationAdjustmentDirection:
          title: expiration_adjustment_direction
          description: Direction of adjustment for forbidden expiry
          $ref: '#/components/schemas/otpki.common.x509.v1.ExpirationAdjustmentDirection'
        allowValidityOverride:
          type: boolean
          title: allow_validity_override
          description: permissions use validity from EE profile (profile takes precedence)
        allowCsrSubjectDnOverride:
          type: boolean
          title: allow_csr_subject_dn_override
          description: use DN from CSR
        allowCsrKeyUsageOverride:
          type: boolean
          title: allow_csr_key_usage_override
          description: use key usage from CSR
        allowCsrExtensionOverride:
          type: boolean
          title: allow_csr_extension_override
        oidListIsWhitelist:
          type: boolean
          title: oid_list_is_whitelist
          description: when true, only OIDs in the list are overrideable, otherwise all extensions are overrideable EXCEPT those in the list
        oidList:
          type: array
          items:
            type: string
            pattern: ^([0-2])((\.0)|(\.[1-9][0-9]*))*$
          title: oid_list
          uniqueItems: true
        basicConstraintsValid:
          type: boolean
          title: basic_constraints_valid
          description: X.509v3 constraints
        maxPathLength:
          type:
            - integer
            - string
          title: max_path_length
          format: int64
          description: |-
            bool is_ca = 1; // will be set by certificate profile kind
             max path length settings will be ignore in EndEntity certificate profile 0 == no max length, unless following bool is set
        maxPathLengthZero:
          type: boolean
          title: max_path_length_zero
          description: flag (from go crypto/x509) that indicates that 0 (uninitialized) path length is actually intended
        includeAuthorityKeyIdentifier:
          type: boolean
          title: include_authority_key_identifier
        akiHashAlgorithm:
          title: aki_hash_algorithm
          description: takes first 20 bytes of hash for AKI
          $ref: '#/components/schemas/otpki.common.issuance.certificate_profile.v1.KeyIdentifierHashAlgorithm'
        includeSubjectKeyIdentifier:
          type: boolean
          title: include_subject_key_identifier
          description: kind != EE causes this to get locked to true
        skiHashAlgorithm:
          title: ski_hash_algorithm
          description: takes first 20 bytes of hash for SKI
          $ref: '#/components/schemas/otpki.common.issuance.certificate_profile.v1.KeyIdentifierHashAlgorithm'
        useKeyUsage:
          type: boolean
          title: use_key_usage
          description: X.509v3 usages
        keyUsageCritical:
          type: boolean
          title: key_usage_critical
        removeEncryptionUsageOnEccKeys:
          type: boolean
          title: remove_encryption_usage_on_ecc_keys
          description: remove key encipherment and data encipherment if using an ECC signing algo
        keyUsages:
          type: array
          items:
            $ref: '#/components/schemas/otpki.common.x509.v1.KeyUsage'
          title: key_usages
          uniqueItems: true
        useExtendedKeyUsage:
          type: boolean
          title: use_extended_key_usage
        extendedKeyUsageCritical:
          type: boolean
          title: extended_key_usage_critical
        extendedKeyUsages:
          type: array
          items:
            $ref: '#/components/schemas/otpki.common.x509.v1.ExtKeyUsage'
          title: extended_key_usages
          uniqueItems: true
        useSubjectAlternativeName:
          type: boolean
          title: use_subject_alternative_name
          description: X.509v3 names san is set during EE or CA creation
        subjectAlternativeNameCritical:
          type: boolean
          title: subject_alternative_name_critical
        useIssuerAlternativeName:
          type: boolean
          title: use_issuer_alternative_name
        issuerAlternativeNameCritical:
          type: boolean
          title: issuer_alternative_name_critical
        useNameConstraints:
          type: boolean
          title: use_name_constraints
          description: name constraints are set during EE or CA creation
        nameConstraintsCritical:
          type: boolean
          title: name_constraints_critical
        useCrlDistributionPoints:
          type: boolean
          title: use_crl_distribution_points
          description: X.509v3 validation
        crlDistributionPointsCritical:
          type: boolean
          title: crl_distribution_points_critical
        useCaDefinedCdp:
          type: boolean
          title: use_ca_defined_cdp
        crlDistributionPointUris:
          type: array
          items:
            type: string
            format: uri
          title: crl_distribution_point_uris
          uniqueItems: true
        useAuthorityInformationAccess:
          type: boolean
          title: use_authority_information_access
        useCaDefinedOcspUri:
          type: boolean
          title: use_ca_defined_ocsp_uri
        ocspUris:
          type: array
          items:
            type: string
            format: uri
          title: ocsp_uris
          uniqueItems: true
        useCaDefinedIssuerUri:
          type: boolean
          title: use_ca_defined_issuer_uri
        issuerUris:
          type: array
          items:
            type: string
            format: uri
          title: issuer_uris
          uniqueItems: true
        ocspNoCheck:
          type: boolean
          title: ocsp_no_check
        cnPrefix:
          type: string
          title: cn_prefix
          maxLength: 64
          description: other
        cnSuffix:
          type: string
          title: cn_suffix
          maxLength: 64
        customExtKeyUsages:
          type: array
          items:
            type: string
            format: uuid
          title: custom_ext_key_usages
          uniqueItems: true
        customCertificateExts:
          type: array
          items:
            type: string
            format: uuid
          title: custom_certificate_exts
          uniqueItems: true
        availableCertificateAuthorities:
          type: array
          items:
            type: string
            format: uuid
          title: available_certificate_authorities
          uniqueItems: true
        approvalProfileId:
          type:
            - string
            - "null"
          title: approval_profile_id
          format: uuid
      title: CertificateProfile
      additionalProperties: false
    otpki.common.issuance.certificate_profile.v1.CertificateProfileKind:
