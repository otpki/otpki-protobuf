      type: object
      properties:
        country:
          type: array
          items:
            type: string
            minLength: 1
          title: country
          uniqueItems: true
        organization:
          type: array
          items:
            type: string
            minLength: 1
          title: organization
          uniqueItems: true
        organizationalUnit:
          type: array
          items:
            type: string
            minLength: 1
          title: organizational_unit
          uniqueItems: true
        locality:
          type: array
          items:
            type: string
            minLength: 1
          title: locality
          uniqueItems: true
        province:
          type: array
          items:
            type: string
            minLength: 1
          title: province
          uniqueItems: true
        streetAddress:
          type: array
          items:
            type: string
            minLength: 1
          title: street_address
          uniqueItems: true
        postalCode:
          type: array
          items:
            type: string
            minLength: 1
          title: postal_code
          uniqueItems: true
        serialNumber:
          type: string
          title: serial_number
        commonName:
          type: string
          title: common_name
          minLength: 1
        names:
          type: array
          items:
            $ref: '#/components/schemas/otpki.common.x509.v1.NameAttribute'
          title: names
          description: For additional name attributes
        extraNames:
          type: array
          items:
            $ref: '#/components/schemas/otpki.common.x509.v1.NameAttribute'
          title: extra_names
      title: Name
      additionalProperties: false
      description: |-
        TODO: replace this with SubjectDNAttribute
         Name represents a distinguished name (DN)
    otpki.common.x509.v1.NameAttribute:
      type: object
      properties:
        type:
          type: string
          title: type
          description: OID as string
        value:
          title: value
          $ref: '#/components/schemas/google.protobuf.Any'
      title: NameAttribute
      additionalProperties: false
      description: NameAttribute represents a name attribute that may not be covered by the standard fields
