        - EXPIRATION_ADJUSTMENT_DIRECTION_UNSPECIFIED
        - EXPIRATION_ADJUSTMENT_DIRECTION_EARLIER
        - EXPIRATION_ADJUSTMENT_DIRECTION_LATER
    otpki.common.x509.v1.ExtKeyUsage:
      type: string
      title: ExtKeyUsage
      enum:
