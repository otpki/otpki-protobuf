openapi: 3.1.0
info:
  title: otpki.common.x509.v1
paths: {}
components:
  schemas:
    google.protobuf.Any:
      type: object
      properties:
        type:
          type: string
        value:
          type: string
          format: binary
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
    otpki.common.x509.v1.DayOfWeek:
      type: string
      title: DayOfWeek
      enum:
        - DAY_OF_WEEK_UNSPECIFIED
        - DAY_OF_WEEK_SUNDAY
        - DAY_OF_WEEK_MONDAY
        - DAY_OF_WEEK_TUESDAY
        - DAY_OF_WEEK_WEDNESDAY
        - DAY_OF_WEEK_THURSDAY
        - DAY_OF_WEEK_FRIDAY
        - DAY_OF_WEEK_SATURDAY
    otpki.common.x509.v1.ExpirationAdjustmentDirection:
