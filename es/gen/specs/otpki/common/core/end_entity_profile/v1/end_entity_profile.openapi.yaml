components:
  schemas:
    google.protobuf.Duration:
      type: string
      format: duration
      description: |-
        A Duration represents a signed, fixed-length span of time represented
         as a count of seconds and fractions of seconds at nanosecond
         resolution. It is independent of any calendar and concepts like "day"
         or "month". It is related to Timestamp in that the difference between
         two Timestamp values is a Duration and it can be added or subtracted
         from a Timestamp. Range is approximately +-10,000 years.

         # Examples

         Example 1: Compute Duration from two Timestamps in pseudo code.

             Timestamp start = ...;
             Timestamp end = ...;
             Duration duration = ...;

             duration.seconds = end.seconds - start.seconds;
             duration.nanos = end.nanos - start.nanos;

             if (duration.seconds < 0 && duration.nanos > 0) {
               duration.seconds += 1;
               duration.nanos -= 1000000000;
             } else if (duration.seconds > 0 && duration.nanos < 0) {
               duration.seconds -= 1;
               duration.nanos += 1000000000;
             }

         Example 2: Compute Timestamp from Timestamp + Duration in pseudo code.

             Timestamp start = ...;
             Duration duration = ...;
             Timestamp end = ...;

             end.seconds = start.seconds + duration.seconds;
             end.nanos = start.nanos + duration.nanos;

             if (end.nanos < 0) {
               end.seconds -= 1;
               end.nanos += 1000000000;
             } else if (end.nanos >= 1000000000) {
               end.seconds += 1;
               end.nanos -= 1000000000;
             }

         Example 3: Compute Duration from datetime.timedelta in Python.

             td = datetime.timedelta(days=3, minutes=10)
             duration = Duration()
             duration.FromTimedelta(td)

         # JSON Mapping

         In JSON format, the Duration type is encoded as a string rather than an
         object, where the string ends in the suffix "s" (indicating seconds) and
         is preceded by the number of seconds, with nanoseconds expressed as
         fractional seconds. For example, 3 seconds with 0 nanoseconds should be
         encoded in JSON format as "3s", while 3 seconds and 1 nanosecond should
         be expressed in JSON format as "3.000000001s", and 3 seconds and 1
         microsecond should be expressed in JSON format as "3.000001s".
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: |-
        A Timestamp represents a point in time independent of any time zone or local
         calendar, encoded as a count of seconds and fractions of seconds at
         nanosecond resolution. The count is relative to an epoch at UTC midnight on
         January 1, 1970, in the proleptic Gregorian calendar which extends the
         Gregorian calendar backwards to year one.

         All minutes are 60 seconds long. Leap seconds are "smeared" so that no leap
         second table is needed for interpretation, using a [24-hour linear
         smear](https://developers.google.com/time/smear).

         The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By
         restricting to that range, we ensure that we can convert to and from [RFC
         3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.

         # Examples

         Example 1: Compute Timestamp from POSIX `time()`.

             Timestamp timestamp;
             timestamp.set_seconds(time(NULL));
             timestamp.set_nanos(0);

         Example 2: Compute Timestamp from POSIX `gettimeofday()`.

             struct timeval tv;
             gettimeofday(&tv, NULL);

             Timestamp timestamp;
             timestamp.set_seconds(tv.tv_sec);
             timestamp.set_nanos(tv.tv_usec * 1000);

         Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.

             FILETIME ft;
             GetSystemTimeAsFileTime(&ft);
             UINT64 ticks = (((UINT64)ft.dwHighDateTime) << 32) | ft.dwLowDateTime;

             // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z
             // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.
             Timestamp timestamp;
             timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));
             timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));

         Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.

             long millis = System.currentTimeMillis();

             Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)
                 .setNanos((int) ((millis % 1000) * 1000000)).build();

         Example 5: Compute Timestamp from Java `Instant.now()`.

             Instant now = Instant.now();

             Timestamp timestamp =
                 Timestamp.newBuilder().setSeconds(now.getEpochSecond())
                     .setNanos(now.getNano()).build();

         Example 6: Compute Timestamp from current time in Python.

             timestamp = Timestamp()
             timestamp.GetCurrentTime()

         # JSON Mapping

         In JSON format, the Timestamp type is encoded as a string in the
         [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the
         format is "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z"
         where {year} is always expressed using four digits while {month}, {day},
         {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional
         seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),
         are optional. The "Z" suffix indicates the timezone ("UTC"); the timezone
         is required. A proto3 JSON serializer should always use UTC (as indicated by
         "Z") when printing the Timestamp type and a proto3 JSON parser should be
         able to accept both UTC and other timezones (as indicated by an offset).

         For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
         01:30 UTC on January 15, 2017.

         In JavaScript, one can convert a Date object to this format using the
         standard
         [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
         method. In Python, a standard `datetime.datetime` object can be converted
         to this format using
         [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
         the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
         the Joda Time's [`ISODateTimeFormat.dateTime()`](
         http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
         ) to obtain a formatter capable of generating timestamps in this format.
    otpki.common.core.end_entity_profile.v1.EndEntityPasswordGenerationCharset:
      type: string
      title: EndEntityPasswordGenerationCharset
      enum:
        - END_ENTITY_PASSWORD_GENERATION_CHARSET_UNSPECIFIED
        - END_ENTITY_PASSWORD_GENERATION_CHARSET_DIGITS_ONLY
        - END_ENTITY_PASSWORD_GENERATION_CHARSET_ENGLISH_LETTERS_AND_DIGITS
        - END_ENTITY_PASSWORD_GENERATION_CHARSET_ALL_PRINTABLE_ENGLISH_CHARACTERS
    otpki.common.core.end_entity_profile.v1.EndEntityProfile:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
          description: not settable on creation
          readOnly: true
        name:
          type: string
          title: name
          maxLength: 64
          minLength: 3
        description:
          type: string
          title: description
        createdAt:
          title: created_at
          description: |-
            db details
             not settable on creation
          readOnly: true
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          description: not settable on creation
          readOnly: true
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        loginIdPrefix:
          type: string
          title: login_id_prefix
          maxLength: 64
          description: identity
        loginIdSuffix:
          type: string
          title: login_id_suffix
          maxLength: 64
        loginIdAutoGenerated:
          type: boolean
          title: login_id_auto_generated
        loginIdValidation:
          type: boolean
          title: login_id_validation
        loginIdRegex:
          type: string
          title: login_id_regex
          description: regex validation that is applied if login_id_validation == true. mutually exclusive with auto-generate
        defaultPassword:
          type: string
          title: default_password
          description: if default == "", and password required == false, EE may have no password
        passwordRequired:
          type: boolean
          title: password_required
        passwordAutoGenerated:
          type: boolean
          title: password_auto_generated
          description: mutually exclusive with prior PW settings
        passwordGenerationCharset:
          title: password_generation_charset
          $ref: '#/components/schemas/otpki.common.core.end_entity_profile.v1.EndEntityPasswordGenerationCharset'
        passwordGenerationLength:
          type:
            - integer
            - string
          title: password_generation_length
          maximum: 0
          minimum: 4
          format: int64
          description: can be unset, or >= 4
        minimumPasswordStrength:
          type:
            - integer
            - string
          title: minimum_password_strength
          format: int64
          description: floor((# chars in PW)*log2(# chars in charset))
        allowCleartextPassword:
          type: boolean
          title: allow_cleartext_password
        useEmail:
          type: boolean
          title: use_email
          description: EE creation allows email to be specified
        emailRequired:
          type: boolean
          title: email_required
          description: EE creation requires email to be specified
        emailDomainModifiable:
          type: boolean
          title: email_domain_modifiable
          description: false == EE creation does not allow domain (@example.com) to be specified
        emailDomain:
          type: string
          title: email_domain
          description: |
            if use_email == true and domain == "", it must be modifiable
            email_domain.isHostname // value must be a valid hostname
        emailNotifications:
          type: boolean
          title: email_notifications
          description: email notifications to the EE (login id + password on creation/rotation)
        smtpSettingsId:
          type:
            - string
            - "null"
          title: smtp_settings_id
          format: uuid
          description: SMTP settings used to send email notifications
        subjectDnAttributes:
          type: array
          items:
            $ref: '#/components/schemas/otpki.common.core.end_entity_profile.v1.EndEntityProfileSubjectDNAttribute'
          title: subject_dn_attributes
          description: |-
            subject DN
             note: certificate email can differ from EE email
        subjectAlternativeNameAttributes:
          type: array
          items:
            $ref: '#/components/schemas/otpki.common.core.end_entity_profile.v1.EndEntityProfileSANAttribute'
          title: subject_alternative_name_attributes
          description: |-
            san
             note: certificate email can differ from EE email
        availableCertificateProfileIds:
          type: array
          items:
            type: string
            format: uuid
          title: available_certificate_profile_ids
          uniqueItems: true
          description: issuance information
        defaultCertificateProfileId:
          type: string
          title: default_certificate_profile_id
          format: uuid
        availableCertificateAuthorityIds:
          type: array
          items:
            type: string
            format: uuid
          title: available_certificate_authority_ids
          uniqueItems: true
        defaultCertificateAuthorityId:
          type: string
          title: default_certificate_authority_id
          format: uuid
        useValidityStartTime:
          type: boolean
          title: use_validity_start_time
          description: validity override, requires 'allow validity override' in certificate profile if this is true, EE can set start time settings, the following values are defaults to set notBefore
        validityStartTimeModifiable:
          type: boolean
          title: validity_start_time_modifiable
          description: whether the EE can set their own params
        validityStartTimeOffset:
          title: validity_start_time_offset
          description: default offset from 'now' when to issue certificate
          $ref: '#/components/schemas/google.protobuf.Duration'
        validityStartDate:
          title: validity_start_date
          description: default start date for notBefore, if both are set, offset is added to start date rather than 'now'
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        useValidityEndTime:
          type: boolean
          title: use_validity_end_time
          description: if this is true, EE can set end time settings, the following values are defaults to set notAfter
        validityEndTimeModifiable:
          type: boolean
          title: validity_end_time_modifiable
          description: whether the EE can set their own params
        validityEndTimeOffset:
          title: validity_end_time_offset
          description: default offset from 'now' when to expire certificate
          $ref: '#/components/schemas/google.protobuf.Duration'
        validityEndDate:
          title: validity_end_date
          description: default end date for notAfter, if both are set, offset is added to end date rather than 'now'
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        useNameConstraintsPermitted:
          type: boolean
          title: use_name_constraints_permitted
          description: |-
            other
             name constraints must be enabled in the certificate profile for these to propagate to certificate allow EE to specify name constraints
        nameConstraintsPermittedRequired:
          type: boolean
          title: name_constraints_permitted_required
          description: require EE to specify name constraints
        useNameConstraintsExcluded:
          type: boolean
          title: use_name_constraints_excluded
        nameConstraintsExcludedRequired:
          type: boolean
          title: name_constraints_excluded_required
        useCustomCertificateExts:
          type: boolean
          title: use_custom_certificate_exts
          description: explicitly do not allow custom ext key usages as key usage is a feature of certificate issuance, not identity allow EE to add to custom exts (will be concatenated with cert profile)
        approvalProfileId:
          type:
            - string
            - "null"
          title: approval_profile_id
          format: uuid
        allowedRequests:
          type:
            - integer
            - string
          title: allowed_requests
          minimum: 0
          format: int64
      title: EndEntityProfile
      additionalProperties: false
    otpki.common.core.end_entity_profile.v1.EndEntityProfileSANAttribute:
      type: object
      properties:
        attributeType:
          not:
            enum:
              - SAN_ATTR_TYPE_UNSPECIFIED
          title: attribute_type
          $ref: '#/components/schemas/otpki.common.x509.v1.SANAttrType'
        attributeValue:
          type: string
          title: attribute_value
        oid:
          type: string
          title: oid
        required:
          type: boolean
          title: required
        modifiable:
          type: boolean
          title: modifiable
        validation:
          type: boolean
          title: validation
        regex:
          type: string
          title: regex
      title: EndEntityProfileSANAttribute
      additionalProperties: false
    otpki.common.core.end_entity_profile.v1.EndEntityProfileSubjectDNAttribute:
      type: object
      properties:
        attributeType:
          not:
            enum:
              - SUBJECT_DN_ATTR_TYPE_UNSPECIFIED
          title: attribute_type
          $ref: '#/components/schemas/otpki.common.x509.v1.SubjectDNAttrType'
        attributeValue:
          type: string
          title: attribute_value
        oid:
          type: string
          title: oid
        required:
          type: boolean
          title: required
        modifiable:
          type: boolean
          title: modifiable
        validation:
          type: boolean
          title: validation
        regex:
          type: string
          title: regex
      title: EndEntityProfileSubjectDNAttribute
      additionalProperties: false
    otpki.common.x509.v1.SANAttrType:
      type: string
      title: SANAttrType
      enum:
        - SAN_ATTR_TYPE_UNSPECIFIED
        - SAN_ATTR_TYPE_DNS_NAME
        - SAN_ATTR_TYPE_EMAIL_ADDRESS
        - SAN_ATTR_TYPE_IP_ADDRESS
        - SAN_ATTR_TYPE_URI
        - SAN_ATTR_TYPE_MS_UPN
        - SAN_ATTR_TYPE_KRB5_KPN
        - SAN_ATTR_TYPE_OID
    otpki.common.x509.v1.SubjectDNAttrType:
      type: string
      title: SubjectDNAttrType
      enum:
        - SUBJECT_DN_ATTR_TYPE_UNSPECIFIED
        - SUBJECT_DN_ATTR_TYPE_COMMON_NAME
        - SUBJECT_DN_ATTR_TYPE_COUNTRY
        - SUBJECT_DN_ATTR_TYPE_ORGANIZATION
        - SUBJECT_DN_ATTR_TYPE_ORGANIZATIONAL_UNIT
        - SUBJECT_DN_ATTR_TYPE_LOCALITY
        - SUBJECT_DN_ATTR_TYPE_PROVINCE
        - SUBJECT_DN_ATTR_TYPE_STREET_ADDRESS
        - SUBJECT_DN_ATTR_TYPE_POSTAL_CODE
        - SUBJECT_DN_ATTR_TYPE_SERIAL_NUMBER
        - SUBJECT_DN_ATTR_TYPE_EMAIL
        - SUBJECT_DN_ATTR_TYPE_DOMAIN_COMPONENT
        - SUBJECT_DN_ATTR_TYPE_OID
security: []
