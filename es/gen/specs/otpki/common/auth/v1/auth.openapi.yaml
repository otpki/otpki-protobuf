    otpki.common.auth.v1.Permission:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
          readOnly: true
        isAllowed:
          type: boolean
          title: is_allowed
        resourceType:
          title: resource_type
          description: when unspecified, is_allowed controls all resources
          $ref: '#/components/schemas/otpki.common.auth.v1.Resource'
        actionType:
          title: action_type
          description: when unspecified, is_allowed grants all actions on a particular resource
          $ref: '#/components/schemas/otpki.common.auth.v1.Action'
        objectId:
          type:
            - string
            - "null"
          title: object_id
          format: uuid
          description: 'when unspecified, is_allowed grants a particular action to all objects, note: not a FK since this is a reference to any arbitrary object'
        roleId:
          type: string
          title: role_id
          format: uuid
          description: |-
            when object_id is specified, is_allowed controls this specific action on this specific object
             when object_id is specified but action_type is unspecified, is_allowed grants all actions on this specific object
          readOnly: true
      title: Permission
      additionalProperties: false
