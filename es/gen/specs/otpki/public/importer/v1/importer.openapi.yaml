    otpki.common.core.key_storage_config.v1.KeyStorageConfig:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
          description: not settable on creation
          readOnly: true
        name:
          type: string
          title: name
          minLength: 3
        description:
          type: string
          title: description
        keyDriverType:
          title: key_driver_type
          $ref: '#/components/schemas/otpki.common.core.key_storage_config.v1.KeyDriverType'
        configData:
          title: config_data
          $ref: '#/components/schemas/google.protobuf.Any'
        cryptoKeyId:
          type:
            - string
            - "null"
          title: crypto_key_id
          format: uuid
        enableActivation:
          type: boolean
          title: enable_activation
          description: |-
            activation
             if this is false, this config cannot be activated and is always "active"
             if it is true, activation is always required.
             note: if the key driver requires an activation pin (like pkcs11proxy) you
             must enable activation
        autoActivation:
          type: boolean
          title: auto_activation
          description: |-
            if this is true, on the first activation, the resulting activation code
             will be persisted and encrypted in the database
             if this is updated to be false, we delete any stored activation code.
             the latest manual activation is always stored as the pin to use for auto activation.
        isActivated:
          type: boolean
          title: is_activated
          description: |-
            this should be a calculated field, not stored in the DB and not settable by
             the end user
          readOnly: true
        verifyActivation:
          type: boolean
          title: verify_activation
          description: |-
            when verify activation is true, the resulting activation code (whether via SSS or direct)
             must match the activation_code_to_verify
             this is primarily used to protect keystores that do not have an external pin requirement (i.e. soft db)
        activationCodeToVerify:
          type: string
          title: activation_code_to_verify
        pluginData:
          title: plugin_data
          readOnly: true
          $ref: '#/components/schemas/google.protobuf.Any'
        createdAt:
          title: created_at
          description: not settable on creation
          readOnly: true
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          description: not settable on creation
          readOnly: true
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: KeyStorageConfig
      additionalProperties: false
