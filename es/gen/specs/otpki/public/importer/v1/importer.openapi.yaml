  /v1/importer/import:
    post:
      tags:
        - otpki.public.importer.v1.ImporterService
      summary: ImportData
      description: |-
        The ImportData route takes a message in the format of an ExportData message.
         The content can be a full or partial export of an otpki system or a crafted message, as long as
         all of the ID references resolve either to relationships in the same import payload or
         existing entities on the target system.
      operationId: otpki.public.importer.v1.ImporterService.ImportData
      parameters:
        - name: options.conflictStrategy
          in: query
          schema:
            title: conflict_strategy
            $ref: '#/components/schemas/otpki.common.core.importer.v1.ConflictStrategy'
        - name: options.dryRun
          in: query
          description: run in tx and rollback, return expected result to client
          schema:
            type: boolean
            title: dry_run
            description: run in tx and rollback, return expected result to client
      requestBody:
        content:
          application/json:
            schema:
              title: data
              $ref: '#/components/schemas/otpki.common.core.importer.v1.ExportData'
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/otpki.public.importer.v1.ImportDataResponse'
