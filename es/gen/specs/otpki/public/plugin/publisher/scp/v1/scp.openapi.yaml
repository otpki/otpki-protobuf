openapi: 3.1.0
info:
  title: otpki.public.plugin.publisher.scp.v1
paths: {}
components:
  schemas:
    otpki.public.plugin.publisher.scp.v1.ScpCertTriggerConfig:
      type: object
      allOf:
        - properties:
            certificateTemplateUrl:
              type: string
              title: certificate_template_url
              minLength: 1
              description: Destination path template rendered with the published certificate's fields
        - oneOf:
            - type: object
              properties:
                caId:
                  type: string
                  title: ca_id
                  format: uuid
              title: ca_id
              required:
                - caId
            - type: object
              properties:
                certificateProfileId:
                  type: string
                  title: certificate_profile_id
                  format: uuid
              title: certificate_profile_id
              required:
                - certificateProfileId
      title: ScpCertTriggerConfig
      additionalProperties: false
      description: Per-trigger config for an SCP certificate (issuance or revocation) trigger
    otpki.public.plugin.publisher.scp.v1.ScpConfig:
      type: object
      properties:
        keyId:
          type: string
          title: key_id
          format: uuid
          description: ssh key in keystore
        username:
          type: string
          title: username
          minLength: 1
        host:
          type: string
          title: host
          minLength: 1
        port:
          type:
            - integer
            - string
          title: port
          maximum: 65535
          minimum: 1
          format: int64
      title: ScpConfig
      additionalProperties: false
      description: Connection settings shared by every trigger that delivers over SSH/SCP
    otpki.public.plugin.publisher.scp.v1.ScpCrlTriggerConfig:
      type: object
      properties:
        caId:
          type: string
          title: ca_id
          format: uuid
        crlTemplateUrl:
          type: string
          title: crl_template_url
          minLength: 1
          description: Destination path template rendered with the published CRL's fields
      title: ScpCrlTriggerConfig
      required:
        - caId
      additionalProperties: false
      description: Per-trigger config for an SCP CRL-publication trigger
security: []
