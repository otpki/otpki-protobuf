openapi: 3.1.0
info:
  title: otpki.public.plugin.publisher.smtp.v1
paths: {}
components:
  schemas:
    otpki.public.plugin.publisher.smtp.v1.SmtpCertTriggerConfig:
      type: object
      allOf:
        - properties:
            recipients:
              type: array
              items:
                type: string
                format: email
              title: recipients
              minItems: 1
              description: Recipients the published certificate is emailed to
            subject:
              type: string
              title: subject
        - oneOf:
            - type: object
              properties:
                caId:
                  type: string
                  title: ca_id
                  format: uuid
              title: ca_id
              required:
                - caId
            - type: object
              properties:
                certificateProfileId:
                  type: string
                  title: certificate_profile_id
                  format: uuid
              title: certificate_profile_id
              required:
                - certificateProfileId
      title: SmtpCertTriggerConfig
      additionalProperties: false
      description: Per-trigger config for an SMTP cert
    otpki.public.plugin.publisher.smtp.v1.SmtpConfig:
      type: object
      properties:
        fromAddress:
          type: string
          title: from_address
          format: email
        fromName:
          type: string
          title: from_name
        host:
          type: string
          title: host
          minLength: 1
        port:
          type: string
          title: port
          minLength: 1
        username:
          type: string
          title: username
        password:
          type: string
          title: password
        encryption:
          title: encryption
          $ref: '#/components/schemas/otpki.public.plugin.publisher.smtp.v1.SmtpEncryption'
        tlsInsecure:
          type: boolean
          title: tls_insecure
      title: SmtpConfig
      additionalProperties: false
      description: Connection settings shared by every trigger that delivers by email
    otpki.public.plugin.publisher.smtp.v1.SmtpCredentialsTriggerConfig:
      type: object
      oneOf:
        - type: object
          properties:
            endEntityId:
              type: string
              title: end_entity_id
              format: uuid
          title: end_entity_id
          required:
            - endEntityId
        - type: object
          properties:
            endEntityProfileId:
              type: string
              title: end_entity_profile_id
              format: uuid
          title: end_entity_profile_id
          required:
            - endEntityProfileId
      title: SmtpCredentialsTriggerConfig
      additionalProperties: false
      description: Targets the end entity that had its credentials delivered
    otpki.public.plugin.publisher.smtp.v1.SmtpCrlTriggerConfig:
      type: object
      properties:
        caId:
          type: string
          title: ca_id
          format: uuid
        recipients:
          type: array
          items:
            type: string
            format: email
          title: recipients
          minItems: 1
          description: Recipients the published CRL is emailed to
        subject:
          type: string
          title: subject
      title: SmtpCrlTriggerConfig
      required:
        - caId
      additionalProperties: false
      description: Per-trigger config for an SMTP CRL
    otpki.public.plugin.publisher.smtp.v1.SmtpEncryption:
      type: string
      title: SmtpEncryption
      enum:
        - SMTP_ENCRYPTION_UNSPECIFIED
        - SMTP_ENCRYPTION_NONE
        - SMTP_ENCRYPTION_STARTTLS
        - SMTP_ENCRYPTION_SSL
security: []
