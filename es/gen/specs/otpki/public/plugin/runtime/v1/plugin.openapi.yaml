openapi: 3.1.0
info:
  title: otpki.public.plugin.runtime.v1
paths:
  /otpki.public.plugin.runtime.v1.PluginRunnerService/Describe:
    post:
      tags:
        - otpki.public.plugin.runtime.v1.PluginRunnerService
      summary: Describe
      operationId: otpki.public.plugin.runtime.v1.PluginRunnerService.Describe
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/otpki.public.plugin.runtime.v1.DescribeRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/otpki.public.plugin.runtime.v1.DescribeResponse'
  /otpki.public.plugin.runtime.v1.PluginRunnerService/Start:
    post:
      tags:
        - otpki.public.plugin.runtime.v1.PluginRunnerService
      summary: Start
      operationId: otpki.public.plugin.runtime.v1.PluginRunnerService.Start
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/otpki.public.plugin.runtime.v1.StartRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/otpki.public.plugin.runtime.v1.StartResponse'
components:
  schemas:
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`. This is used to determine the schema of the data in the `value` field and is the discriminator for the `debug` field.'
        value:
          type: string
          format: binary
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          oneOf:
            - type: object
              title: Any
              additionalProperties: true
              description: Detailed error information.
          discriminator:
            propertyName: type
          title: Debug
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    otpki.common.auth.v1.Action:
      type: string
      title: Action
      enum:
        - ACTION_UNSPECIFIED
        - ACTION_CREATE
        - ACTION_READ
        - ACTION_UPDATE
        - ACTION_DELETE
        - ACTION_ISSUE
        - ACTION_REVOKE
    otpki.public.plugin.runtime.v1.CustomResource:
      type: object
      properties:
        displayName:
          type: string
          title: display_name
        allowedActions:
          type: array
          items:
            $ref: '#/components/schemas/otpki.common.auth.v1.Action'
          title: allowed_actions
        allowsObjectId:
          type: boolean
          title: allows_object_id
      title: CustomResource
      additionalProperties: false
    otpki.public.plugin.runtime.v1.DescribeRequest:
      type: object
      title: DescribeRequest
      additionalProperties: false
    otpki.public.plugin.runtime.v1.DescribeResponse:
      type: object
      properties:
        manifest:
          title: manifest
          $ref: '#/components/schemas/otpki.public.plugin.runtime.v1.Manifest'
      title: DescribeResponse
      additionalProperties: false
    otpki.public.plugin.runtime.v1.FrontendPageHeader:
      type: object
      properties:
        title:
          type: string
          title: title
        path:
          type: string
          title: path
      title: FrontendPageHeader
      additionalProperties: false
    otpki.public.plugin.runtime.v1.FrontendSidebarItem:
      type: object
      properties:
        title:
          type: string
          title: title
        path:
          type: string
          title: path
      title: FrontendSidebarItem
      additionalProperties: false
    otpki.public.plugin.runtime.v1.FrontendSidebarSpec:
      type: object
      properties:
        title:
          type: string
          title: title
        parentGroup:
          type: string
          title: parent_group
        items:
          type: array
          items:
            $ref: '#/components/schemas/otpki.public.plugin.runtime.v1.FrontendSidebarItem'
          title: items
      title: FrontendSidebarSpec
      additionalProperties: false
    otpki.public.plugin.runtime.v1.Manifest:
      type: object
      properties:
        name:
          type: string
          title: name
        migrations:
          type: array
          items:
            $ref: '#/components/schemas/otpki.public.plugin.runtime.v1.Migration'
          title: migrations
        routes:
          type: array
          items:
            $ref: '#/components/schemas/otpki.public.plugin.runtime.v1.RouteSpec'
          title: routes
        headers:
          type: array
          items:
            $ref: '#/components/schemas/otpki.public.plugin.runtime.v1.FrontendPageHeader'
          title: headers
        sidebar:
          title: sidebar
          $ref: '#/components/schemas/otpki.public.plugin.runtime.v1.FrontendSidebarSpec'
        uiPathPrefix:
          type: string
          title: ui_path_prefix
        customResourceDefinitions:
          type: object
          title: custom_resource_definitions
          additionalProperties:
            title: value
            $ref: '#/components/schemas/otpki.public.plugin.runtime.v1.CustomResource'
          description: |-
            since auth resource/action enums are simply just int32
             we can technically store arbitrary numbers in place of the permissions
             we just need a mapping for the UI to be able to take the unknown number and
             convert it to a human readable string. These should be maps from plugin-defined
             constants to human-readable resources.
      title: Manifest
      additionalProperties: false
    otpki.public.plugin.runtime.v1.Manifest.CustomResourceDefinitionsEntry:
      type: object
      properties:
        key:
          type: integer
          title: key
          format: int32
        value:
          title: value
          $ref: '#/components/schemas/otpki.public.plugin.runtime.v1.CustomResource'
      title: CustomResourceDefinitionsEntry
      additionalProperties: false
    otpki.public.plugin.runtime.v1.Migration:
      type: object
      properties:
        migrationSchema:
          type: string
          title: migration_schema
        files:
          type: object
          title: files
          additionalProperties:
            type: string
            title: value
            format: byte
          description: map of file name to file contents
      title: Migration
      additionalProperties: false
    otpki.public.plugin.runtime.v1.Migration.FilesEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
          format: byte
      title: FilesEntry
      additionalProperties: false
    otpki.public.plugin.runtime.v1.RouteSpec:
      type: object
      properties:
        protocol:
          title: protocol
          $ref: '#/components/schemas/otpki.public.plugin.runtime.v1.RouteSpec.Protocol'
        address:
          type: string
          title: address
          description: location of listener on plugin side (0.0.0.0:<port>)
        pathPrefix:
          type: string
          title: path_prefix
        gatewayPort:
          type: integer
          title: gateway_port
          description: only needed for UDP/TCP
      title: RouteSpec
      additionalProperties: false
    otpki.public.plugin.runtime.v1.RouteSpec.Protocol:
      type: string
      title: Protocol
      enum:
        - PROTOCOL_UNSPECIFIED
        - PROTOCOL_HTTP
        - PROTOCOL_TCP
        - PROTOCOL_UDP
    otpki.public.plugin.runtime.v1.StartRequest:
      type: object
      properties:
        pluginRuntimeServer:
          type: integer
          title: plugin_runtime_server
      title: StartRequest
      additionalProperties: false
    otpki.public.plugin.runtime.v1.StartResponse:
      type: object
      title: StartResponse
      additionalProperties: false
security: []
tags:
  - name: otpki.public.plugin.runtime.v1.PluginRunnerService
