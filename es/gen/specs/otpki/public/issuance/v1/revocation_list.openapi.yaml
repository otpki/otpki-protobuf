    otpki.common.x509.v1.RevocationList:
      type: object
      properties:
        raw:
          type: string
          title: raw
          format: byte
          description: Raw contains the complete ASN.1 DER content of the CRL
        rawTbsRevocationList:
          type: string
          title: raw_tbs_revocation_list
          format: byte
          description: RawTBSRevocationList contains just the tbsCertList portion of the ASN.1 DER
        rawIssuer:
          type: string
          title: raw_issuer
          format: byte
          description: RawIssuer contains the DER encoded Issuer
        issuer:
          title: issuer
          description: Issuer contains the DN of the issuing certificate
          $ref: '#/components/schemas/otpki.common.x509.v1.Name'
        authorityKeyId:
          type: string
          title: authority_key_id
          format: byte
          description: AuthorityKeyId is used to identify the public key associated with the issuing certificate
        signature:
          type: string
          title: signature
          format: byte
          description: Signature data
        signatureAlgorithm:
          title: signature_algorithm
          description: SignatureAlgorithm is used to determine the signature algorithm for signing
          $ref: '#/components/schemas/otpki.common.x509.v1.SignatureAlgorithm'
        revokedCertificateEntries:
          type: array
          items:
            $ref: '#/components/schemas/otpki.common.x509.v1.RevocationListEntry'
          title: revoked_certificate_entries
          description: RevokedCertificateEntries represents the revoked certificates sequence in the CRL
        revokedCertificates:
          type: array
          items:
            $ref: '#/components/schemas/otpki.common.x509.v1.RevokedCertificate'
          title: revoked_certificates
          description: |-
            Deprecated in favor of revoked_certificate_entries
             Included for backward compatibility
        number:
          type: string
          title: number
          description: Number is a monotonically increasing sequence number for a given CRL scope and issuer Using string to represent big.Int
        thisUpdate:
          title: this_update
          description: Update timestamps
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        nextUpdate:
          title: next_update
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        extensions:
          type: array
          items:
            $ref: '#/components/schemas/otpki.common.x509.v1.Extension'
          title: extensions
          description: Extensions
        extraExtensions:
          type: array
          items:
            $ref: '#/components/schemas/otpki.common.x509.v1.Extension'
          title: extra_extensions
      title: RevocationList
      additionalProperties: false
      description: |-
        TODO: no more proto revocation lists
         RevocationList represents a Certificate Revocation List (CRL) as specified by RFC 5280
    otpki.common.x509.v1.RevocationListEntry:
      type: object
      properties:
        raw:
          type: string
          title: raw
          format: byte
          description: Raw contains the raw bytes of the revokedCertificates entry
        serialNumber:
          type: string
          title: serial_number
          description: SerialNumber represents the serial number of a revoked certificate Using string to represent big.Int
        revocationTime:
          title: revocation_time
          description: RevocationTime represents the time at which the certificate was revoked
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        reasonCode:
          type: integer
          title: reason_code
          format: int32
          description: ReasonCode represents the reason for revocation (RFC 5280 Section 5.3.1)
        extensions:
          type: array
          items:
            $ref: '#/components/schemas/otpki.common.x509.v1.Extension'
          title: extensions
          description: Extensions
        extraExtensions:
          type: array
          items:
            $ref: '#/components/schemas/otpki.common.x509.v1.Extension'
          title: extra_extensions
      title: RevocationListEntry
      additionalProperties: false
      description: RevocationListEntry represents an entry in a CRL for a revoked certificate
    otpki.common.x509.v1.RevokedCertificate:
      type: object
      properties:
        serialNumber:
          type: string
          title: serial_number
          description: SerialNumber represents the serial number of a revoked certificate Using string to represent big.Int
        revocationTime:
          title: revocation_time
          description: RevocationTime represents the time at which the certificate was revoked
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        extensions:
          type: array
          items:
            $ref: '#/components/schemas/otpki.common.x509.v1.Extension'
          title: extensions
          description: Extensions
      title: RevokedCertificate
      additionalProperties: false
      description: |-
        RevokedCertificate is included for backward compatibility
         This represents the older PKIX variant used in the deprecated field
