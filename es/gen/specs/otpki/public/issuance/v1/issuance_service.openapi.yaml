        content:
          application/json:
            schema:
              title: config
              $ref: '#/components/schemas/otpki.common.issuance.publisher.v1.PublisherConfig'
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/otpki.public.issuance.v1.UpdatePublisherConfigResponse'
