    otpki.common.issuance.key_storage_config.v1.Activation:
      type: object
      properties:
        keyStorageConfigId:
          type: string
          title: key_storage_config_id
          format: uuid
          description: |-
            the key storage config for which to apply this
             activation. the key storage config will control
             whether or not this is persisted via auto-activation
        useAutoActivation:
          type: boolean
          title: use_auto_activation
          description: |-
            when this is checked, it will ignore all the other fields
             and just use the stored auto activation code if it exists
        activationCode:
          type: string
          title: activation_code
          description: this is the provided pin
        secretShares:
          type: array
          items:
            type: string
            minLength: 2
          title: secret_shares
          uniqueItems: true
          description: |-
            if the pin is an empty string, attempt to
             construct the pin from secret shares. note: these should be hex strings
             and can be formatted any which way (i.e. 0xDEADBEEF, DEADBEEF, DE AD BE EF, 0Xdeadbeef, etc.)
        activationDuration:
          title: activation_duration
          description: |-
            if activation duration is set, this will a) prevent code from being stored for auto activation
             and b) restrict the activation code from being used after this period of time
             if it is unset and the key storage config does not have auto activation, this activation will
             persist for the lifetime of the activation state store (either in mem or valkey backed)
          $ref: '#/components/schemas/google.protobuf.Duration'
      title: Activation
      additionalProperties: false
    otpki.common.issuance.key_storage_config.v1.KeyDriverType:
      type: string
      title: KeyDriverType
      enum:
        - KEY_DRIVER_TYPE_UNSPECIFIED
        - KEY_DRIVER_TYPE_SOFTDBKMS
        - KEY_DRIVER_TYPE_AWSKMS
        - KEY_DRIVER_TYPE_AZUREKMS
        - KEY_DRIVER_TYPE_GCLOUDKMS
        - KEY_DRIVER_TYPE_ISSKMS
        - KEY_DRIVER_TYPE_PKCS11
    otpki.common.issuance.key_storage_config.v1.KeyStorageConfig:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
          description: not settable on creation
          readOnly: true
        name:
          type: string
          title: name
          minLength: 3
        description:
          type: string
          title: description
        keyDriverType:
          title: key_driver_type
          $ref: '#/components/schemas/otpki.common.issuance.key_storage_config.v1.KeyDriverType'
        configData:
          title: config_data
          $ref: '#/components/schemas/google.protobuf.Any'
        cryptoKeyId:
          type:
            - string
            - "null"
          title: crypto_key_id
          format: uuid
        enableActivation:
          type: boolean
          title: enable_activation
          description: |-
            activation
             if this is false, this config cannot be activated and is always "active"
             if it is true, activation is always required.
             note: if the key driver requires an activation pin (like pkcs11proxy) you
             must enable activation
        autoActivation:
          type: boolean
          title: auto_activation
          description: |-
            if this is true, on the first activation, the resulting activation code
             will be persisted and encrypted in the database
             if this is updated to be false, we delete any stored activation code.
             the latest manual activation is always stored as the pin to use for auto activation.
        isActivated:
          type: boolean
          title: is_activated
          description: |-
            this should be a calculated field, not stored in the DB and not settable by
             the end user
          readOnly: true
        verifyActivation:
          type: boolean
          title: verify_activation
          description: |-
            when verify activation is true, the resulting activation code (whether via SSS or direct)
             must match the activation_code_to_verify
             this is primarily used to protect keystores that do not have an external pin requirement (i.e. soft db)
        activationCodeToVerify:
          type: string
          title: activation_code_to_verify
        pluginData:
          title: plugin_data
          readOnly: true
          $ref: '#/components/schemas/google.protobuf.Any'
        createdAt:
          title: created_at
          description: not settable on creation
          readOnly: true
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          description: not settable on creation
          readOnly: true
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: KeyStorageConfig
      additionalProperties: false
    otpki.common.issuance.plugin.key_driver.v1.KeyDriverMessage:
      type: object
      properties:
        keyStorageConfigId:
          type: string
          title: key_storage_config_id
          format: uuid
        message:
          title: message
          $ref: '#/components/schemas/google.protobuf.Any'
      title: KeyDriverMessage
      additionalProperties: false
