openapi: 3.1.0
info:
  title: otpki.public.issuance.secret_share.v1
paths:
  /v1/secret-shares/combine:
    post:
      tags:
        - otpki.public.issuance.secret_share.v1.SecretShareService
      summary: CombineSecret
      operationId: otpki.public.issuance.secret_share.v1.SecretShareService.CombineSecret
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/otpki.public.issuance.secret_share.v1.CombineSecretRequest'
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/otpki.public.issuance.secret_share.v1.CombineSecretResponse'
  /v1/secret-shares/split:
    post:
      tags:
        - otpki.public.issuance.secret_share.v1.SecretShareService
      summary: SplitSecret
      operationId: otpki.public.issuance.secret_share.v1.SecretShareService.SplitSecret
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/otpki.public.issuance.secret_share.v1.SplitSecretRequest'
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/otpki.public.issuance.secret_share.v1.SplitSecretResponse'
components:
  schemas:
    otpki.public.issuance.secret_share.v1.CombineSecretRequest:
      type: object
      properties:
        shares:
          type: array
          items:
            type: string
          title: shares
          description: hex strings
      title: CombineSecretRequest
      additionalProperties: false
    otpki.public.issuance.secret_share.v1.CombineSecretResponse:
      type: object
      properties:
        secret:
          type: string
          title: secret
      title: CombineSecretResponse
      additionalProperties: false
    otpki.public.issuance.secret_share.v1.SplitSecretRequest:
      type: object
      properties:
        secret:
          type: string
          title: secret
        threshold:
          type:
            - integer
            - string
          title: threshold
          maximum: 255
          minimum: 2
          format: int64
        shares:
          type:
            - integer
            - string
          title: shares
          maximum: 255
          minimum: 2
          format: int64
        generateForms:
          type: boolean
          title: generate_forms
      title: SplitSecretRequest
      additionalProperties: false
      description: |
        shares_gte_threshold // shares must be greater than or equal to threshold
    otpki.public.issuance.secret_share.v1.SplitSecretResponse:
      type: object
      properties:
        shares:
          type: array
          items:
            type: string
          title: shares
          description: hex strings
        formZip:
          type: string
          title: form_zip
          format: byte
      title: SplitSecretResponse
      additionalProperties: false
security: []
tags:
  - name: otpki.public.issuance.secret_share.v1.SecretShareService
