                 (buf.validate.field).field_mask.example = { paths: ["c.a", "d"] }
               ];
             }
             ```
      title: FieldMaskRules
      additionalProperties: false
      description: FieldMaskRules describe rules applied exclusively to the `google.protobuf.FieldMask` well-known type.
